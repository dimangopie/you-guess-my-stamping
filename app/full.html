<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>限乘通告 · 本班已满员 · 1管51 站 — 你拼我猜</title>
<link rel="stylesheet" href="base.css">
<style>
/* ============================================================
   full = 限乘通告 —— 房间满员 / 名额已满
   机构形态：贴在车厢门上的限乘通告（横版、压扁、贴得最低）
   主章：.stamp.round.ink「满员」（右下角，压在骑缝上）
   办理指引：登记候补（.slot 抽签筒 → 给出候补号）
   物理动作：右下 .hole 归档孔 · .label 已张贴 · .creased 折过
   简化律：两段条文 → 一句标题；「未登记」用 .pip；
           刷新时刻从文字按钮改成一枚 .ibtn；出口不再重复候补按钮。
   ============================================================ */
.mla{margin-left:auto}

.limhd{padding:34px 0 8px}

/* 通告纸：横版、压得最低、贴得最歪 */
/* 通告是「贴」在墙上的，不居中。
   居中会让它读起来像对话框 —— 而这四页是站台通告。
   纸和它下面的出口列表必须共用同一条基准边，否则会互相错开。
   四页偏移量各不相同：墙不是网格，通告本来就不会贴在同一条线上
   （和 .stamp 的 -7°、.stamp.bar 的 -1.5° 是同一个道理）。 */
.paperfull{position:relative;max-width:900px;margin:0 0 0 9%;transform:rotate(1.4deg);
  padding:24px 30px 30px;border-top:6px solid var(--ink)}
.paperfull .hole{right:24px;top:26px}
/* base 的 .stamp 是 nowrap，88px 圆里两个字也得能折 */
.paperfull .stamp.round{white-space:normal;line-height:1.3}
@media(max-width:560px){.paperfull{padding:20px 16px 24px;transform:none;border-top-width:5px}}

.tag-tl{position:absolute;left:-10px;top:-13px;transform:rotate(-5deg)}
.tag-tr{position:absolute;right:-12px;top:64px;transform:rotate(7deg)}
.tag-br{position:absolute;right:-10px;bottom:-13px;transform:rotate(4deg)}
@media(max-width:560px){.tag-tl{left:4px}.tag-tr{right:4px}.tag-br{right:4px}}

/* 抬头 */
.pf-hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  border-bottom:2.5px solid var(--ink);padding-bottom:10px}

/* 两栏：一句标题 + 主章 | 当前班次 */
.two{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:26px;margin-top:18px}
@media(max-width:820px){.two{grid-template-columns:1fr;gap:22px}}

/* 左栏：一句话说清发生了什么 */
.body-l h1{font-size:clamp(20px,3.4vw,30px);font-weight:900;letter-spacing:.1em;line-height:1.55;
  max-width:14em}

/* 满员章：盖在右下角，压着骑缝 */
.cap-stamp{position:relative;margin-top:22px;min-height:96px}
.cap-stamp .stamp.round.ink{position:absolute;right:6px;bottom:-6px;width:96px;height:96px;
  font-size:13px;letter-spacing:.16em;line-height:1.4}
@media(max-width:560px){.cap-stamp{min-height:0;padding-bottom:100px}
  .cap-stamp .stamp.round.ink{right:auto;left:0;bottom:0}}

/* 右栏：当前班次 */
.berth .sheet-hd{gap:10px}
.berth .rows{padding:6px 18px 14px}
.berth .r{display:flex;align-items:baseline;gap:10px;padding:9px 0;
  border-bottom:1px dotted var(--ink-4);font-family:var(--mono);font-size:12.5px}
.berth .r:last-child{border-bottom:none}
.berth .r .k{color:var(--ink-3);letter-spacing:.1em;white-space:nowrap}
.berth .r .v{margin-left:auto;font-weight:700;letter-spacing:.04em;
  font-variant-numeric:tabular-nums;text-align:right}
.berth .r .v.blue{color:var(--blue)}
.berth .r .v.red{color:var(--red-ink)}
.berth .r .v.amber{color:var(--amber-ink)}
.seats{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 2px}
.seats i{width:15px;height:15px;border:1.5px solid var(--ink);border-radius:2px;
  background:var(--red);display:block}
.seats i.free{background:var(--paper-4)}

/* 候补登记 */
.wait{margin-top:22px;border:2px solid var(--ink);border-radius:var(--rad);background:var(--paper-2);
  padding:18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
.wait .acts{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.wait .slot{margin:0}
.wait .slot .qno{font-family:var(--mono);font-weight:700;font-size:30px;letter-spacing:.04em;
  line-height:1;color:var(--red-ink)}
.wait .slot .qno.idle{color:var(--ink-3)}
.wait .slot .cap{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--ink-3);
  text-align:center;margin-top:6px}
@media(max-width:700px){.wait{grid-template-columns:1fr;gap:16px}}

.result{padding:2px 0}
.result .line1{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);line-height:2}
.result .line1 b{color:var(--ink)}
.result .no-big{font-family:var(--mono);font-weight:900;font-size:clamp(24px,3.4vw,34px);
  letter-spacing:.06em;color:var(--red-ink);line-height:1.15;font-variant-numeric:tabular-nums}
.result .pos{margin-top:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.result .pos .k{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--ink-3)}
.result .pos .n{font-family:var(--mono);font-weight:700;font-size:26px;color:var(--ink);
  font-variant-numeric:tabular-nums}
.result .fine{margin-top:10px;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);line-height:1.95}

/* 时刻表 */
.tt{margin-top:24px}
.tt-hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  border-bottom:2.5px solid var(--ink);padding-bottom:10px}
.tt-hd .ibtn{margin-left:auto}
.tt .board{margin-top:0;border-top:none;border-radius:0 0 var(--rad) var(--rad)}
.tt .row{grid-template-columns:96px minmax(0,1fr) 92px 92px}
.tt .row .c3{white-space:normal}
.tt .row.now .c2{color:var(--amber-ink)}
.tt .row.now{background:rgba(201,138,14,.10)}
@media(max-width:640px){.tt .row{grid-template-columns:70px minmax(0,1fr) 62px}
  .tt .row .c4{display:none}}

/* 出口 */
.exits{max-width:900px;margin:0 0 0 9%;padding-top:22px}
.note-out{margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.06em}
@media(max-width:960px){.paperfull, .exits{margin-left:0;margin-right:0}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#22304F">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="你拼我猜">
</head>
<body>


<header class="nav">
  <div class="wrap">
    <a class="logo" href="index.html">你拼我猜<span class="no">1管51</span></a>
    <nav>
      <a href="plaza.html">广场</a>
      <a href="banks.html">词库</a>
      <a href="works.html">我的作品</a>
      <a href="me.html">我的主页</a>
    </nav>
    <a class="btn sm" href="login.html">办证 / 进站</a>
  </div>
</header>

<main class="limhd">
  <div class="wrap">

    <!-- ==================== 限乘通告 ==================== -->
    <article class="sheet paperfull creased">
      <span class="hole" aria-hidden="true"></span>
      <span class="label tag-tl">已张贴</span>
      <span class="label tag-tr">限乘 6 人</span>
      <span class="label tag-br">车厢门留存</span>

      <div class="pf-hd">
        <span class="lbl">限 乘 通 告 · 第 1管51-C 号</span>
        <span class="lbl mla" id="postedAt">--:-- 张贴</span>
      </div>

      <div class="two">
        <!-- 左：一句标题 + 满员章 -->
        <div class="body-l">
          <h1>本班次已满员，<br>站台不再放行</h1>
          <div class="cap-stamp">
            <span class="stamp round ink" id="capStamp">满<br>员</span>
          </div>
        </div>

        <!-- 右：当前班次 -->
        <aside class="sheet berth">
          <div class="sheet-hd">
            <span class="lbl">当 前 班 次</span>
            <span class="tag-out mla" id="berthNo">1管51</span>
          </div>
          <div class="rows">
            <div class="r"><span class="k">席 位</span><span class="v red" id="seatTx">6 / 6 已满</span></div>
            <div class="seats" id="seats" aria-hidden="true"></div>
            <div class="r"><span class="k">模 式</span><span class="v">四 人 抢 猜</span></div>
            <div class="r"><span class="k">发 车</span><span class="v amber" id="depart">已 发 车</span></div>
            <div class="r"><span class="k">下 一 班</span><span class="v blue" id="next1">--:--</span></div>
            <div class="r"><span class="k">还 有</span><span class="v" id="nextIn">--</span></div>
            <div class="r"><span class="k">候 补 人 数</span><span class="v red" id="waitN">0</span></div>
            <div class="r"><span class="k">本 站 时 刻</span><span class="v" id="clock">--:--:--</span></div>
          </div>
        </aside>
      </div>

      <!-- 候补登记 -->
      <div class="wait">
        <div class="slot">
          <div class="qno idle" id="slotNo">—</div>
          <div class="cap">本 人 候 补 号</div>
        </div>
        <div class="acts">
          <button class="btn" type="button" id="regBtn">登 记 候 补</button>
          <a class="btn ghost" href="plaza.html">先去广场等</a>
          <div class="result" id="result">
            <span class="pip off">未登记</span>
          </div>
        </div>
      </div>

      <!-- 下一班时刻表 -->
      <div class="tt">
        <div class="tt-hd">
          <span class="lbl">本 站 时 刻 表</span>
          <button class="ibtn" type="button" id="ttBtn" aria-label="刷新时刻" title="刷新时刻">🔄</button>
        </div>
        <div class="board light" id="ttRows"></div>
      </div>

    </article>

    <!-- ==================== 出口 ==================== -->
    <div class="exits">
      <div class="btn-row">
        <a class="btn blue" href="plaza.html">回站前广场</a>
        <a class="btn ghost" href="banks.html">查时刻表</a>
        <a class="btn ghost" href="index.html">回站台首页</a>
      </div>
      <p class="note-out" id="exitNote">满员是暂时的，空位随时会有。</p>
    </div>

  </div>
</main>

<footer class="site">
  <div class="wrap">
    <span>你拼我猜 · 1管51 站 · 限乘通告</span>
    <span>一小时加开四班。</span>
  </div>
</footer>

<script>
/* ============================================================
   full —— 限乘通告（房间满员 / 名额已满）
   真实行为：「登记候补」点了给一个候补编号，并显示「当前候补 N 位」；
             重复登记会被拒绝，只说一次。
   ============================================================ */
const $ = id => document.getElementById(id);
const p2 = x => String(x).padStart(2, "0");

/* ---------- 班次与基础数据 ---------- */
const CAP = 6;                                     /* 一节车厢就这么大 */
const taken = 6;                                   /* 本班已满 */
const baseWait = 3;                                /* 你到之前已经排了 3 位 */
let myNo = null, myPos = null, regCount = 0;

const berthNo = "1管51-" + String(Math.floor(Math.random() * 90) + 10);
$("berthNo").textContent = berthNo;
$("postedAt").textContent = p2(new Date().getHours()) + ":" + p2(new Date().getMinutes()) + " 张贴";

/* 席位方块 */
$("seats").innerHTML = Array.from({ length: CAP }, (_, i) =>
  '<i class="' + (i < taken ? "" : "free") + '"></i>').join("");
$("seatTx").textContent = taken + " / " + CAP + " 已满";

/* ---------- 时刻：下一班是 6 分钟后的整分钟 ---------- */
const now = new Date();
const next = new Date(now.getTime() + 6 * 60000);
next.setSeconds(0, 0);
const hm = d => p2(d.getHours()) + ":" + p2(d.getMinutes());
$("next1").textContent = hm(next);
$("waitN").textContent = String(baseWait);

/* ---------- 倒计时：还有多久发车 ---------- */
function tick(){
  const d = new Date();
  $("clock").textContent = p2(d.getHours()) + ":" + p2(d.getMinutes()) + ":" + p2(d.getSeconds());
  const s = Math.max(0, Math.floor((next - d) / 1000));
  $("nextIn").textContent = s > 0 ? (Math.floor(s / 60) + " 分 " + p2(s % 60) + " 秒") : "正在发车";
  $("depart").textContent = s > 0 ? "已 发 车" : "正 在 发 车";
}
tick(); setInterval(tick, 1000);

/* ---------- 时刻表：就近三班 ---------- */
function renderTT(){
  const list = [0, 1, 2].map(i => {
    const t = new Date(next.getTime() + i * 7 * 60000);
    return {
      no: "1管51-" + String(Math.floor(Math.random() * 90) + 10),
      t: hm(t),
      cap: i === 0 ? "满 员" : (i === 1 ? "余 2 位" : "余 5 位"),
      st: i === 0 ? "本 班" : "候 车"
    };
  });
  $("ttRows").innerHTML = list.map((r, i) =>
    '<div class="row' + (i === 0 ? " now" : "") + '">' +
      '<div class="c1">' + r.no + '</div>' +
      '<div class="c2">' + r.t + '</div>' +
      '<div class="c3">' + r.cap + '</div>' +
      '<div class="c4">' + r.st + '</div>' +
    '</div>').join("");
}
renderTT();
$("ttBtn").addEventListener("click", () => {
  renderTT();
  $("exitNote").textContent = "时刻已刷新：本班仍然满员。";
});

/* ---------- 登记候补：给号 + 显示当前候补 N 位 ---------- */
function register(){
  if(myNo){
    $("result").innerHTML =
      '<div class="line1">已登记过 · 候补号 <b>' + myNo + '</b> · 第 <b>' + myPos + '</b> 位</div>' +
      '<div class="fine">一个人只占一个号，重复登记无效。</div>';
    $("result").classList.add("slot-draw");
    setTimeout(() => $("result").classList.remove("slot-draw"), 460);
    return;
  }

  regCount++;
  const seq = baseWait + regCount;                       /* 排在你前面的 + 你自己 */
  myPos = seq;
  myNo = "候补 " + berthNo + "-C" + p2(seq);
  $("waitN").textContent = String(seq);

  /* 抽签筒里抽出一个号 */
  const slotNo = $("slotNo");
  slotNo.textContent = "C" + p2(seq);
  slotNo.classList.remove("idle", "slot-draw");
  void slotNo.offsetWidth;
  slotNo.classList.add("slot-draw");

  $("result").innerHTML =
    '<div class="line1">号已发给你</div>' +
    '<div class="no-big"><i class="ico" aria-hidden="true">🎫</i>' + myNo + '</div>' +
    '<div class="pos"><span class="k">当 前 候 补</span><span class="n" id="posN">' + myPos + '</span><span class="k">位</span></div>' +
    '<div class="fine">叫到号三分钟不出现就作废。</div>';
  $("regBtn").textContent = "已 登 记 候 补";
  $("result").classList.add("slot-draw");
  $("exitNote").textContent = "你已排到候补第 " + myPos + " 位 · 过号作废。";
  console.log("%c候补已登记","color:#17171B;font-size:13px;font-weight:700",
    "\n号：" + myNo + " · 当前候补第 " + myPos + " 位");
}
$("regBtn").addEventListener("click", register);

/* ---------- 主章落纸 + 归档打孔 ---------- */
const cs = $("capStamp");
cs.style.opacity = "0";
requestAnimationFrame(() => { cs.style.opacity = ""; cs.classList.add("stamping"); });

const hole = document.querySelector(".paperfull .hole");
if(hole) setTimeout(() => hole.classList.add("punching"), 440);

/* ---------- 控制台留痕 ---------- */
console.log("%c限乘通告 · 1管51 站","color:#4A4841;font-size:14px;font-weight:700;letter-spacing:.08em");
console.log("%c满员章盖在右下角，压着骑缝 —— 压到骑缝的章才算数，所以这一页是真的。\n" +
  "· 「登记候补」会给一个候补号，并且真的把候补人数加一。\n" +
  "· 本班 " + CAP + " 个席位全满。等下一班比等这一班快，去广场转转也一样。",
  "color:#4A4841;line-height:1.75;font-family:monospace");
</script>
<script src="pwa.js"></script>
</body>
</html>
