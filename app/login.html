
    </div>

    <div class="sheet">
      <div class="sheet-hd"><span class="lbl">办 证 须 知</span></div>
      <div class="sheet-bd">
        <ul class="notice-list">
          <li>办公 08:00 – 22:00</li>
          <li>一人一号 · 不可转让</li>
          <li>证件长期有效</li>
        </ul>
      </div>
    </div>

  </aside>
</section>

</main>

<footer class="site">
  <div class="wrap">
    <span>你拼我猜 · 办证处</span>
    <span>1管51 站 · 当场发证</span>
  </div>
</footer>

<script>
const $=id=>document.getElementById(id);

/* ---------- 标签页 ---------- */
document.querySelectorAll(".tabs button").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll(".tabs button").forEach(x=>
      x.setAttribute("aria-selected",String(x===b)));
    $("panel-in").hidden  = b.dataset.p!=="in";
    $("panel-new").hidden = b.dataset.p!=="new";
  });
});

/* ---------- 取号 ---------- */
const Q=["A3","A4","A5","A6","A7"];
$("qList").innerHTML=Q.map(q=>`<i class="${q==="A6"?"now":""}">${q}</i>`).join("");

/* ---------- 照相（物理动作：按快门）---------- */
const FACES=["🐦","🦊","🐟","🐙","🦉","🐢","🦌","🐝","🦜","🐳","🦔","🐧"];
const photo=$("photo");
function shoot(){
  photo.classList.add("done");
  photo.textContent=FACES[Math.floor(Math.random()*FACES.length)];
  photo.classList.remove("stamping");
  void photo.offsetWidth;
  photo.classList.add("stamping");
  checkReady();
}
photo.addEventListener("click",shoot);
photo.addEventListener("keydown",e=>{
  if(e.key==="Enter"||e.key===" "){e.preventDefault();shoot();}
});

/* ---------- 防伪核对（机构版的验证码）---------- */
const POOL=["🚦","🌊","🚦","🌙","🎣","🚦","🐟","🚥","⚪"];
const TARGET="🚦";
$("sample").textContent=TARGET;
let picked=null, verified=false;
$("grid").innerHTML=POOL.map((e,i)=>`<div class="cell" data-i="${i}">${e}</div>`).join("");
$("grid").addEventListener("click",e=>{
  const c=e.target.closest(".cell"); if(!c) return;
  document.querySelectorAll("#grid .cell").forEach(x=>x.classList.remove("on"));
  c.classList.add("on");
  picked=c.textContent;
  verified=(picked===TARGET);
  // 机构走流程：核对不通过也放行，只是留一句记录
  $("capNote").innerHTML = verified
    ? '<span style="color:var(--blue)">✓ 核对通过 · 记入档案</span>'
    : '<span style="color:var(--red-ink)">与样张不符 · 已记录在案</span>';
  checkReady();
});

/* ---------- 就绪判定：状态靠 .pip 的颜色说 ---------- */
function checkReady(){
  const ok=photo.classList.contains("done") && picked!==null;
  $("doNew").disabled=!ok;
  const pip=$("newHint");
  pip.textContent = ok ? "可以提交" : "待照相核对";
  pip.className   = "pip " + (ok ? "on" : "warm");
}

/* ---------- 发证（盖章 + 归档打孔）---------- */
function issue(name,face,kind){
  const no="1管51-"+String(100+Math.floor(Math.random()*899));
  const cert=document.createElement("div");
  cert.className="issued";
  cert.innerHTML=`
    <div class="cert">
      <div class="row1">
        <span class="tag-no blue">${kind}</span>
        <span class="lbl">拼 图 许 可 证</span>
        <span class="stamp bar blue" style="margin-left:auto">长期有效</span>
      </div>
      <div class="who">
        <div class="av">${face}</div>
        <div>
          <div class="nm">${name}</div>
          <div class="lbl" style="margin:6px 0 8px">持 证 人</div>
          <div class="lbl">证 件 编 号</div>
          <div class="no">${no}</div>
        </div>
      </div>
      <div class="dash"></div>
      <div class="hint">签发 · 1管51 站办证处</div>
      <span class="stamp round" id="bigSeal">1管51<br>办证处</span>
    </div>`;
  const form=$("form");
  form.parentNode.insertBefore(cert,form);
  form.hidden=true;

  // 钢印落下
  const seal=cert.querySelector("#bigSeal");
  requestAnimationFrame(()=>seal.classList.add("stamping"));
  // 归档：在证件右上角打一个孔
  setTimeout(()=>{
    const h=document.createElement("span");
    h.className="hole";
    h.style.right="14px";h.style.top="14px";
    cert.querySelector(".cert").appendChild(h);
    requestAnimationFrame(()=>h.classList.add("punching"));
  },520);

  cert.scrollIntoView({behavior:"smooth",block:"center"});
}

$("doIn").addEventListener("click",()=>{
  const no=$("inNo").value.trim(), pw=$("inPw").value;
  if(!no||!pw){alert("请填写证件编号与取件暗号。");return;}
  issue("持证人",FACES[Math.floor(Math.random()*FACES.length)],"持 证 进 站");
});
$("doNew").addEventListener("click",()=>{
  const name=$("newName").value.trim()||"未署名";
  const face=photo.textContent.trim();
  issue(name,face,"现 场 办 证");
});

/* ---------- 签名栏：空着也能办 ---------- */
$("signLine").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();e.target.blur();}});
</script>
<script src="pwa.js"></script>
</body>
</html>
