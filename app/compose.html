<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拼图台 · 制作单 — 你拼我猜</title>
<link rel="stylesheet" href="base.css">
<style>
/* ============================================================
   拼图台 · 制作单
   素材库取牌 → 拖到画布 → 控制点调姿 → 封存交题

   四条修正：
   ① 画布是固定比例的「画板」，牌用画布相对单位定尺寸 ——
      构图在任何尺寸下长得一样（此前用绝对 px，缩小视口就撑破画布）
   ② 素材库按类别分页（一次显示一类，不淹没）
   ③ 取牌 = 从素材库拖到画布，落点由玩家决定
   ④ 缩放 / 旋转 / 图层都由控制点决定，不用滑杆
   ============================================================ */

.head{padding:22px 0 4px}
/* ⚠ 原来是 46px 上边距 + 两行巨型标题，在 1366×768 上吃掉约 300px ——
   K3：「画布上沿起始于 ~320px、画布底边落在 ~790px，视口只有 768px，
   画布最下面一截和「重发这手牌」按钮整个掉出首屏。而这个页面的核心手势是拖放，
   **拖到画布下四分之一之前得先滚一次页面。**」
   改成单行 + 收紧上边距，回收约 150px。 */
.head .tk{font-size:clamp(24px,2.6vw,36px);line-height:1.25}
.head h1{margin:12px 0 14px}

/* 子元素解除 min-width 下限：grid 的 1fr 是 minmax(auto,1fr)，
   那个 auto 等于内容的 min-content，窄屏下列会被顶住不缩。 */
.bench>*{min-width:0}

/* ---------- 素材库（原转盘位）---------- */

/* ── 素材库（取代转盘）──────────────────────────────────────
   左栏 300px 不变 —— 原设计的三栏节奏保留，只是里面换了东西。
   emoji 按类别分组，每类 12–16 个精选，够拼谜面又不至于淹没。 */
.lib-box{text-align:left}
.lib-tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.lib-tabs button{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  padding:3px 7px;border:1.5px solid var(--ink-4);border-radius:2px;
  background:var(--paper-4);color:var(--ink-3);cursor:pointer;line-height:1.5}
.lib-tabs button:hover{border-color:var(--ink);color:var(--ink)}
.lib-tabs button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.lib-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.lib-grid button{aspect-ratio:1;display:grid;place-items:center;
  font-family:var(--emoji);font-size:24px;line-height:1;
  background:var(--paper-4);border:1.5px solid var(--ink-4);border-radius:2px;
  cursor:grab;padding:0;touch-action:none;transition:box-shadow .12s}
.lib-grid button:hover{border-color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.lib-grid button:active{cursor:grabbing}
.lib-note{display:flex;align-items:center;gap:10px;margin-top:12px;
  padding-top:10px;border-top:1.5px dashed var(--ink-4)}
.lib-note .lbl:last-of-type{margin-left:auto}
.lib-note b{color:var(--ink);font-weight:700}

/* ---------- 画板 ---------- */
.canvas-box{min-width:0}
.canvas{position:relative;width:100%;aspect-ratio:1/1;margin:0 auto;
  overflow:hidden;background:var(--paper-4);border:1.5px solid var(--ink-4);border-radius:var(--rad);
  box-shadow:var(--sh-soft);touch-action:none;
  background-image: repeating-linear-gradient(0deg,rgba(23,23,27,.06) 0 1px,transparent 1px 8px), repeating-linear-gradient(90deg,rgba(23,23,27,.06) 0 1px,transparent 1px 8px)}
.canvas.armed{outline:2px dashed var(--blue);outline-offset:-7px}
.canvas .ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  font-family:var(--mono);font-size:12px;color:var(--ink-2);line-height:2;pointer-events:none}   /* --ink-4 只有 4.12:1 */

/* 牌：尺寸用画布相对单位（--u = 画布宽度的 1%，由 JS 维护）
   —— 这样构图在任何视口下长得一模一样 */
.pc{position:absolute;font-family:var(--emoji);line-height:1;cursor:grab;user-select:none;
  font-size:calc(var(--u) * 12);
  transform:translate(-50%,-50%) scale(var(--s)) rotate(var(--r));
  filter:drop-shadow(1px 2px 0 rgba(23,23,27,.14));
  padding:.04em;border-radius:.06em;touch-action:none}
.pc.sel{cursor:move}
.pc .g{pointer-events:none;filter:var(--sticker)}
.pc.stamping{animation:stamp-down .28s cubic-bezier(.3,1.5,.5,1)}
@keyframes stamp-down{
  0%{transform:translate(-50%,-50%) scale(calc(var(--s) * 2)) rotate(var(--r));opacity:.2}
  60%{transform:translate(-50%,-50%) scale(calc(var(--s) * .94)) rotate(var(--r));opacity:1}
  100%{transform:translate(-50%,-50%) scale(var(--s)) rotate(var(--r))}}

/* 选中框与控制点：控制点反向缩放，尺寸恒定 */
.pc.sel::before{content:"";position:absolute;inset:-.12em;border:1.5px dashed var(--blue);
  border-radius:.1em;pointer-events:none}
.pc .h{position:absolute;width:16px;height:16px;background:#fff;border:2px solid var(--blue);
  border-radius:50%;transform:scale(calc(1 / var(--s)));cursor:pointer;display:none;z-index:2}
.pc.sel .h{display:block}
.pc .h-rot{left:50%;top:-30px;margin-left:-8px;cursor:grab}
.pc .h-rot::after{content:"↻";position:absolute;inset:0;display:grid;place-items:center;
  font-size:10px;color:var(--blue)}
.pc .h-scale{right:-9px;bottom:-9px;cursor:nwse-resize;background:var(--blue)}
.pc .h-scale::after{content:"";position:absolute;inset:3px;border-right:1.5px solid #fff;
  border-bottom:1.5px solid #fff}
/* 图层与删除：贴在选中框下方的小工具条 */
.pc .pbar{position:absolute;left:50%;bottom:-46px;transform:translateX(-50%) scale(calc(1 / var(--s)));
  display:none;gap:4px;background:var(--paper-4);border:1.5px solid var(--ink);
  border-radius:3px;padding:3px;box-shadow:2px 2px 0 rgba(23,23,27,.18);z-index:3}
.pc.sel .pbar{display:flex}
.pc .pbar button{width:24px;height:24px;display:grid;place-items:center;cursor:pointer;
  background:var(--paper-2);border:1.5px solid var(--ink-4);border-radius:2px;
  font-family:var(--emoji);font-size:12px;line-height:1;padding:0}
.pc .pbar button:hover{background:var(--paper-3);border-color:var(--ink)}

/* 拖动中的浮牌（跟手） */
.drag-ghost{position:fixed;z-index:999;pointer-events:none;font-family:var(--emoji);line-height:1;
  font-size:40px;filter:drop-shadow(2px 4px 0 rgba(23,23,27,.3));opacity:.92;
  transform:translate(-50%,-50%)}
.drag-ghost.out{opacity:.35}

/* ---------- 制作单 ---------- */
.order .sheet-hd{gap:8px}
.order .sheet-hd .stamp{margin-left:auto;font-size:10px;padding:3px 8px}
.ansrow{display:flex;gap:8px;margin:4px 0 2px}
.ansrow input{flex:1;border:none;border-bottom:2px solid var(--ink);background:transparent;
  font-family:var(--mono);font-size:17px;padding:6px 2px;color:var(--ink);outline:none;
  letter-spacing:.1em;border-radius:0;min-width:0}
.ansrow input:focus{border-bottom-color:var(--blue)}
.ansrow input::placeholder{color:var(--ink-2)}   /* --ink-4 只有 3.77:1 */
.od{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px dotted var(--ink-4);
  font-family:var(--mono);font-size:12.5px}
.od:last-of-type{border-bottom:none}
.od .k{color:var(--ink-3);font-size:11px;letter-spacing:.1em;white-space:nowrap}
.od .d{flex:1;border-bottom:1px dotted var(--ink-4);transform:translateY(-4px)}
.od b{color:var(--ink);white-space:nowrap}
.od b.blue{color:var(--blue)}

/* ── 整页铺满视口（导航 + 报头 + 三栏 + 页尾都在一屏内）──────────
   实测 1366×768：文档 827px，**页尾 y743→827 完全在屏外**，
   要滚 59px 才看得到 —— 用户的原话是「页尾没有」。
   同时三栏底部参差 140px（素材库 465 / 画布栏 521 / 制作单 381），
   三个岛各自结束在不同高度上。

   做法：body 竖排 flex，main 撑满，bench 撑满 → 页尾被顶到视口底部。
   三栏 align-items:stretch 等高，底边齐平。 */
/* 三栏等高（原来是 align-items:start，各自结束在不同高度） */
/* 画布按可用高度定尺寸，不写死 */

/* ── 让整页（含页尾）落在一屏内 ────────────────────────────────
   实测 1366×768、未改前：
       nav 72 · head 72→196(124) · bench 196→743(547) · footer 743→827(84)
       文档 827 —— **页尾整条在屏外**，要滚 59px 才看得到（用户：「页尾没有」）
   需要砍 59px。逐项砍：head −28、footer −28、画布 −3。 */
.head{padding:12px 0 2px}
.head h1{margin:8px 0 10px}
footer.site{padding:14px 0}

/* 三栏等高：原来是 align-items:start，三块各自结束在不同高度
   （素材库 657 / 画布栏 662 / 制作单 573），底边参差 89px。
   改成 stretch，并把每块做成竖向 flex，让内部的纸面撑满。 */
.bench .sheet,.bench .canvas-box{display:flex;flex-direction:column}
.bench .sheet .sheet-bd{flex:1 1 auto}
.bench .canvas-box{justify-content:flex-start}
/* 素材库的说明条推到面板底 —— 面板被 stretch 拉高后，它下面会空 ~95px 纸 */
.lib-note{margin-top:auto}

/* ── 照房间的布局：紧凑控制条 + 三栏（左素材 / 中画布 / 右交题）──
   房间的比例是 294 / 1fr / 326，这里照搬（右栏要放得下交题单）。
   顶部控制条取代了原来的大报头 —— 房间的调度单就是这么做的。 */
.bench{display:grid;grid-template-columns:294px minmax(0,1fr) 326px;
  gap:18px;align-items:start;padding-top:16px}
.bench .col{display:flex;flex-direction:column;min-width:0}
.bench .sheet,.bench .canvas-box,.bench .order{display:flex;flex-direction:column}
.canvas-box{justify-content:flex-start}
.order{border-top:none;border-radius:0 0 var(--rad) var(--rad)}
.lib-box{border-radius:0 0 var(--rad) var(--rad);padding:0}
.lib-box .sheet-bd{padding:14px}
.col-hd .tag-no{font-size:10.5px}
/* 画布接视口高度 —— 房室里画布是主体，但不能把按钮挤出屏幕 */

.lib-grid button{font-size:22px}
/* 交题单的竖向节奏收紧 —— 它是三栏里最高的一栏，之前是它在决定整页高度 */
.order .sheet-bd{padding:14px}
.order .od{padding:6px 0}
.order .ansrow{margin-top:8px}
/* ⚠ 三栏用的是 <section class="col">，而 base.css:141 有 section{padding:80px 0} ——
   每栏白吃 80px 上下内边距，三栏共多出 160px，整页因此超高 115px。
   房间的 .col 也是 section，但它没暴露这个（房间本来就长）。
   这里是画布页，必须一屏装下，所以显式清零。
   （现已收归 base.css 的 .col，两页共用） */
/* 中栏盒体：照房间 —— 有边框、填纸白、画布缩在盒里当内边距 */
.stage-box{border-radius:0 0 var(--rad) var(--rad)}
.stage-box .sheet-bd{display:flex;flex-direction:column;align-items:center}
/* ⚠ 不要再写 padding ——base.css 的 .sheet-bd{padding:22px} 就是两页共用的值。
   我原来在这里覆盖成 18px，导致同一视口下画布差 8px（436 vs 428）。
   用户要求：「在同一窗口尺寸下，房间和拼图台画布大小应该一样」。 */
/* ── 三栏竖向拉满（K3 第 2 项）────────────────────────────────
   K3：「房间栏栏顶到视口底，拼图台全页 814px 封顶，1080 下留 266px 死区，
   左/右栏高度固定 585/430，页面显得「小件、浮在顶上」。
   **房间的感觉来自「栏顶齐、栏身到底」，而不是栏底齐。**」
   做法：三栏等高（stretch），每栏竖向 flex，栏内的盒体吃满剩余高度。 */
.bench{align-items:stretch}
.bench > .col{align-self:stretch}
.bench .col > .sheet,
.bench .col > .board,
.bench .col > .stage-box{flex:1 1 auto}
.bench .col > .stage-box{display:flex;flex-direction:column}
.bench .col > .stage-box > .sheet-bd{flex:1 1 auto}
.lib-grid{align-content:start}
/* ② 右栏边框色：这一栏从 .sheet 改成 .board 之后，
   .board 的 border 是 var(--screen-2)（藏青 #18233B），左右两栏却是 var(--ink)。
   K3：「拼图台右栏框线是藏青 (24,35,59)，房间右栏是墨黑 (23,23,27)；
   中栏盒框两边都是 (23,23,27) ✅。**同屏两种框色，细看能察觉。**」 */
.order{border-color:var(--ink)}
/* ③ 竖向拉满：让栏身在任何视口高度都够到视口底。
   K3 第 2 项实测：@768 死区 0px ✅，但 @900 剩 120px、@1080 剩 216px。
   它的判断：「房间的『到底』来自内容溢出、栏身被视口底边切断；
   拼图台是『页脚收口 + 下面空着』——@768 恰好收在底边上，@900/@1080 就露馅。」
   做法：body 竖排 flex + main 撑满 + bench 撑满，页脚被顶到视口底。
   内容比视口高时照常滚动，不会压扁。 */
body{display:flex;flex-direction:column;min-height:100vh}
main{flex:1 1 auto;display:flex;flex-direction:column}
main > .wrap{flex:none}
.bench{flex:1 1 auto;min-height:0}
/* ④ 让 grid 的那一行吃满 bench 的高度 —— 光有 bench{flex:1} 不够：
   bench 元素变高了，但里面唯一那行 grid 仍是 auto（= 最高内容），
   实测三栏底边在 768/900/1080 三档下**都是 586**，多余高度全浪费。
   minmax(0,1fr) 才是「这一行吃掉剩余高度」。 */
/* ④ 两个 flex bug（实测出来的）：
   ① `.bench` 的类名是 "bench wrap" —— 我的 `main > .wrap{flex:none}` 把它也打中了，
      实测 bench 的 flexGrow = 0，所以它在 768/900/1080 三档下高度都是 454，不跟视口长。
      改成只命中控制条那个 wrap。
   ② 画布是 flex 子项，被 flex 收缩挤到 247px。加 flex:none 让它按自身宽度定尺。 */
main > .wrap:not(.bench){flex:none}
.canvas{flex:none}
/* ⑤ 画布在 .sheet-bd（column flex + align-items:center）里被收缩到内容宽 ——
   实测三档都是 247px，而同一视口下房间是 428/428/620。
   align-self:stretch 让它吃满盒宽，再由 .canvas 的 max-width(--cv) 与 margin:auto 定尺居中。 */
.stage-box .sheet-bd > .canvas{align-self:stretch}
/* 响应式（照房间的三档）—— 老设计那三条已删，避免两套模板并存 */
@media(max-width:1240px){.bench{grid-template-columns:266px minmax(0,1fr) 292px;gap:14px}}
@media(max-width:1000px){.bench{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .bench > .col:nth-of-type(3){grid-column:1/-1}}
@media(max-width:820px){.bench{grid-template-columns:minmax(0,1fr)}}
/* ⑥ ⚠ 这个坑我在第 1 轮修过一次，加 flex 链时又引回来了：
   `.bench` 的类名含 `wrap`，而 `.wrap{margin:0 auto}` —— 在 flex 列容器里，
   交叉轴上的 auto 外边距会让子项按 **fit-content** 定宽，
   于是 bench 实测卡在 991px，三档视口都不长（房间是 1132 / 1552）。
   显式给满宽即可。 */
main > *{width:100%}

/* ── 画布不该有「单据级」的框 ────────────────────────────────
   用户问：「画布嵌入在容器内部是不是违背了设计语言？」
   ——是，而且是**同一材质自我嵌套**：
       .sheet.stage-box  border:2px solid var(--ink)  background:var(--paper-4)  ← 单据级
         .sheet-bd       padding:22px
           .canvas       border:2px solid var(--ink)  background:var(--paper-4)  ← 又一模一样的圈
   设计语言里 2px --ink 是**单据边界**的分量（.sheet 用它）；
   纸上的内容块该用 --ink-4 —— base.css 的 .snap 正是 1.5px solid var(--ink-4)，
   房间中栏的画布就是 .snap。拼图台却给了画布单据级的框，
   等于在同一张单里又画了一个「单据」，读起来是两张单叠在一起。
   改成与 .snap 同款：**一粗（单据）一细（内容）**。
</style>

<main>

<!-- ============ 制作单控制条（照房间的调度单模式）============
     原来这里是 46px 大报头 + 巨型标题，吃掉 176px。
     房间的写法是紧凑控制条：标题在条里，不单起一屏。 -->
<div class="wrap">
  <div class="sheet creased">
    <div class="sheet-hd rh-hd">
      <span class="tag-no">NO. 1管5-129</span>
      <span class="rh-title tk-sm">制 作 单</span>
      <span class="tag-out">拼 图 台</span>
      <span class="cast quiet">按住 emoji 拖到画布 · 点已放好的可以调它</span>
      <div class="rh-set">
        <span class="tag-out">限时 60 秒</span>
        <button class="ibtn" id="sndBtn" title="音效开关" aria-label="音效开关">🔊</button>
      </div>
    </div>
  </div>
</div>

<section class="bench wrap">

  <!-- ================= 素材库（取代转盘） =================
       用户要求：拼图台不使用转盘，可以从**分类精选的 emoji 子集**里任意取用。
       与房间的关系：两处共用同一个画布与同一套牌（同一套 .pc 物理），
       区别只在**牌从哪来** —— 房间由计时器自动出牌（看+猜），
       拼图台由玩家从素材库取牌（制作）。逻辑不冲突。 -->
  <section class="col">
  <div class="col-hd">
    <span class="tag-no">A</span>
    <span class="lbl" id="libName">自 然</span>
    <span class="lbl r">素 材 库</span>
  </div>
  <div class="board light bind lib-box">
    <div class="sheet-bd">
      <div class="lib-tabs" id="libTabs" role="tablist"></div>
      <div class="lib-grid" id="libGrid" role="group" aria-label="emoji 素材"></div>
      <div class="lib-note">
        <span class="lbl" id="hintTxt">按住拖到画布</span>
        <span class="lbl">已 用 <b id="used">0</b></span>
        <button class="ibtn" id="sndBtn" title="音效开关" aria-label="音效开关">🔊</button>
      </div>
    </div>
  </div>
  </section>

  <!-- ================= 画板 ================= -->
  <section class="col">
  <!-- 中栏是**盒体**，照房间：.sheet > .sheet-hd + .sheet-bd。
       K3：「房间中栏是一个有完整边框的盒子，从栏顶直通到视口底外，盒内填纸白；
       画布缩在盒里，两侧留白读作盒子的内边距。
       拼图台的中栏**没有盒子** —— 只有一条贯通栏宽的标头条，下面悬一个正方形画布，
       两侧直接露出页面格纸底，中栏看起来是「断的」。」 -->
  <div class="sheet stage-box">
  <div class="sheet-hd">
    <span class="tag-no blue">谜 面</span>
    <span class="stamp bar blue" id="stateStamp">未 封 存</span>
    <span class="lbl r">谜 底 待 填</span>
  </div>
  <div class="sheet-bd canvas-box">
    <div class="canvas" id="canvas">
      <div class="ph" id="ph">把 emoji 拖到这里<br><span style="font-size:11px">点一下已放好的可以调它</span></div>
    </div>
    <div class="btn-row" style="justify-content:center;margin-top:14px">
      <button class="btn sm ghost" id="resetBtn">清 空 画 布</button>
    </div>
  </div>
  </div>
  </section>

  <!-- ================= 制作单 ================= -->
  <section class="col">
  <div class="col-hd">
    <span class="tag-no">C</span>
    <span class="lbl">交 题 单</span>
  </div>
  <aside class="board light bind order">
    <div class="sheet-bd">
      <div class="ansrow">
        <input type="text" id="ans" placeholder="谜底答案" maxlength="12" autocomplete="off">
      </div>
      <div class="od"><span class="k">分 类</span><span class="d"></span><b>成语</b></div>
      <div class="od"><span class="k">已 用</span><span class="d"></span><b class="blue" id="used">0</b></div>
      <div class="btn-row" style="margin-top:16px">
        <button class="btn" id="fileBtn" disabled>封 存 交 题</button>
      </div>
      <div class="hint" style="margin-top:10px" id="fileHint">先拖几个 emoji，再填答案</div>
    </div>
  </aside>
</section>

</section>

</main>

<script>
const $=id=>document.getElementById(id);

/* ============================================================
   音效：Web Audio 合成「盖章」，不加载任何音频文件
   ============================================================ */
let AC=null, sndOn=true;
function ac(){
  if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended") AC.resume();
  return AC;
}
function stampSound(power){
  if(!sndOn) return;
  let c; try{ c=ac(); }catch(e){ return; }
  const t=c.currentTime, p=Math.max(.35,Math.min(1.6,power||1));
  const o=c.createOscillator(), g=c.createGain();
  o.type="sine";
  o.frequency.setValueAtTime(190*p,t);
  o.frequency.exponentialRampToValueAtTime(46,t+.11);
  g.gain.setValueAtTime(.26*p,t);
  g.gain.exponentialRampToValueAtTime(.0008,t+.17);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+.19);
  const n=Math.floor(c.sampleRate*.045);
  const buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3.2);
  const src=c.createBufferSource(); src.buffer=buf;
  const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=1700; bp.Q.value=.85;
  const ng=c.createGain(); ng.gain.value=.16*p;
  src.connect(bp).connect(ng).connect(c.destination); src.start(t);
}
function pickSound(){
  if(!sndOn) return;
  let c; try{ c=ac(); }catch(e){ return; }
  const t=c.currentTime, o=c.createOscillator(), g=c.createGain();
  o.type="square"; o.frequency.setValueAtTime(880,t);
  o.frequency.exponentialRampToValueAtTime(420,t+.05);
  g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0005,t+.07);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+.08);
}

/* ============================================================
   ① 画板单位：--u = 画布宽度的 1%
   牌的字号 = calc(var(--u) * 12)，于是构图在任何尺寸下一致
   ============================================================ */
const cv=$("canvas");
function setUnit(){ cv.style.setProperty("--u", (cv.clientWidth/100)+"px"); }
new ResizeObserver(setUnit).observe(cv);
setUnit();

/* ============================================================
   ② 素材库：按类别分组，每组 12–16 个精选 emoji
   ============================================================ */
/* ── 素材库：分类精选的 emoji 子集 ──────────────────────────
   拼图台与房间共用同一套牌（同一个 .pc 物理、同一套拖放手势），
   区别只在**牌从哪来**：房间由计时器自动出牌，拼图台从下面这些类别里取。
   每一类控制在 12–16 个 —— 够拼出谜面，又不至于让人在两百个 emoji 里找。 */
const LIB = {
  "自然": ["☀️","🌙","⭐","🔥","💧","🌊","🌧️","❄️","🌈","🌪️","⚡","🌫️","🌋","🏔️","🌵","🍃"],
  "器物": ["🪵","🧯","🔪","🔨","🚪","🪜","🧲","⏰","🔑","💡","📌","🧱","🪣","🔦","📎","🧰"],
  "人物": ["🧑","👶","👴","🧑‍🍳","🧑‍🚒","🧑‍⚕️","🕵️","👮","🧑‍🌾","🧑‍🎤","🧑‍🚀","👻"],
  "动作": ["🏃","🤝","👀","🗣️","🚶","🙇","🤸","🧗","🤾","🕺","💃","🧎"],
  /* K3：「动作类里塞着 🤔 和 👀，说明表情脸被拆散进了人物/动作。
     对成语猜谜来说 😂😭😡😱 这类脸是一等材料（哭笑不得、目瞪口呆、眉开眼笑），
     埋在动作和人物里会找不到。」→ 独立成类。 */
  "表情": ["😂","😭","😡","😱","🤔","😴","🥶","🥵","😊","😬","🤯","😇","🤑","🤫","😤","🥳"],
  "食物": ["🍚","🍜","🍎","🍞","🍵","🍶","🥚","🍖","🧂","🍯","🍕","🍰"],
  "场所": ["🏠","🏢","🏫","🏥","🚉","🏭","🏪","🏟️","🏝️","🌉","🏰","⛺"],
  "动物": ["🐶","🐱","🐟","🐦","🐍","🐘","🦊","🐝","🦀","🐢","🦌","🐑"],
  "交通": ["🚗","🚌","🚲","✈️","🚢","🚂","🛵","🚁","🛺","⛵"],
  /* 符号类补上数字与方向箭头 —— 七上八下要 7️⃣8️⃣、东张西望要 ↔️ */
  "符号": ["❓","❗","💤","💥","♻️","⭕","❌","✅","🔺","🔻","⬆️","⬇️","⬅️","➡️",
           "1️⃣","2️⃣","3️⃣","7️⃣","8️⃣","🔟","➕","➖"]
};
const LIB_KEYS = Object.keys(LIB);
let libCur = LIB_KEYS[0];
/* ── 渲染素材库 ── */
function renderLib(){
  $("libTabs").innerHTML = LIB_KEYS.map(k=>
    `<button type="button" role="tab" data-k="${k}" class="${k===libCur?"on":""}"
       aria-selected="${k===libCur}">${k}</button>`).join("");
  $("libGrid").innerHTML = LIB[libCur].map((g,i)=>
    `<button type="button" data-i="${i}" title="拖到画布上">${g}</button>`).join("");
  $("libName").textContent = libCur.split("").join(" ");
}
$("libTabs").addEventListener("click",e=>{
  const b=e.target.closest("button[data-k]"); if(!b) return;
  libCur=b.dataset.k; renderLib();
});
renderLib();

let pieces=[], zTop=1, sel=null, carry=null;   /* 计数不用变量 —— 从 pieces.length 派生 */

/* ============================================================
   ③ 取牌 = 从素材库拖到画布（落点由玩家决定）
   鼠标：按住拖 → 松开落下
   触屏：点一下拿起（跟手）→ 再点画布落下
   ============================================================ */
function pickUp(spoke,glyph,x,y){
  const el=document.createElement("div");
  el.className="drag-ghost"; el.textContent=glyph;
  el.style.left=x+"px"; el.style.top=y+"px";
  document.body.appendChild(el);
  carry={btn:spoke,glyph,ghost:el,startX:x,startY:y,moved:false};
  moveGhost(x,y); pickSound();
}
function moveGhost(x,y){
  if(!carry) return;
  carry.ghost.style.left=x+"px"; carry.ghost.style.top=y+"px";
  const r=cv.getBoundingClientRect();
  const inside = x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;
  carry.ghost.classList.toggle("out",!inside);
}
function cancelCarry(){
  if(!carry) return;
  carry.ghost.remove(); carry=null; cv.classList.remove("armed");
  $("hintTxt").textContent="按住 emoji 拖到画布";
}
function putDown(clientX,clientY){
  if(!carry) return false;
  const b=box();
  const inside = clientX>=b.l&&clientX<=b.l+b.w&&clientY>=b.t&&clientY<=b.t+b.h;
  if(!inside){ cancelCarry(); return false; }
  const x=(clientX-b.l)/b.w*100, y=(clientY-b.t)/b.h*100;
  const sp=carry.btn, glyph=carry.glyph;
  carry.ghost.remove(); carry=null; cv.classList.remove("armed");
  sp.classList.add("used");
  $("hintTxt").textContent = "按住 emoji 拖到画布";
  place(glyph,x,y,true);
  return true;
}

$("libGrid").addEventListener("pointerdown",e=>{
  const sp=e.target.closest("button[data-i]");
  if(!sp) return;
  e.preventDefault();
  cancelCarry();
  pickUp(sp, sp.textContent.trim(), e.clientX, e.clientY);
  try{ sp.setPointerCapture(e.pointerId); }catch(_){}
});
$("libGrid").addEventListener("pointermove",e=>{
  if(!carry) return;
  if(Math.hypot(e.clientX-carry.startX,e.clientY-carry.startY)>5) carry.moved=true;
  moveGhost(e.clientX,e.clientY);
});
$("libGrid").addEventListener("pointerup",e=>{
  if(!carry) return;
  if(carry.moved){                       // 拖动了 → 松手即落
    putDown(e.clientX,e.clientY);
  }else{                                 // 只是点了一下 → 保持跟手，等玩家点画布
    cv.classList.add("armed");
    $("hintTxt").textContent="已拿起 · 点画布放下";
  }
});
$("libGrid").addEventListener("pointercancel",cancelCarry);
addEventListener("keydown",e=>{ if(e.key==="Escape") cancelCarry(); });

/* ============================================================
   放牌
   ============================================================ */
function place(glyph,x,y,isNew){
  const el=document.createElement("div");
  el.className="pc";
  el.style.left=x+"%"; el.style.top=y+"%";
  el.style.setProperty("--s",1);
  el.style.setProperty("--r","0deg");
  el.dataset.z=++zTop; el.style.zIndex=el.dataset.z;
  el.innerHTML=`<span class="g">${glyph}</span>
    <span class="h h-rot" title="拖动旋转（按住 Shift 吸附 15°）"></span>
    <span class="h h-scale" title="拖动缩放"></span>
    <span class="pbar">
      <button type="button" data-a="top" title="置顶">⬆</button>
      <button type="button" data-a="bottom" title="置底">⬇</button>
      <button type="button" data-a="del" title="删掉这张">🗑</button>
    </span>`;
  cv.appendChild(el); pieces.push(el);
  clampInto(el);
  if(isNew){ el.classList.add("stamping"); setTimeout(()=>el.classList.remove("stamping"),300); stampSound(1); }
  $("ph").style.display="none";
  select(el); refresh();
}

/* ⚠ 一个数字工具：parseFloat 失败才回退，不要用 || 兜底。
   `parseFloat(x) || 50` 是错的 —— 位置合法地等于 0 时，0 是假值，
   会被当成"没值"而替换成 50。表现就是牌一拖到左/上边缘就弹回中心。 */
function num(v,dflt){ const n=parseFloat(v); return isNaN(n)?dflt:n; }

/* 画布的内容盒（left:% 的参照系）。
   注意：left:% 相对的是**内边距盒**，而 getBoundingClientRect() 给的是**边框盒**，
   两者差一个 2px 边框。统一用这一个函数取，避免两套坐标系各夹各的。 */
function box(){
  const r=cv.getBoundingClientRect(), cs=getComputedStyle(cv);
  return { l:r.left+parseFloat(cs.borderLeftWidth),
           t:r.top +parseFloat(cs.borderTopWidth),
           w:cv.clientWidth, h:cv.clientHeight };
}

/* 把 emoji 夹在画布里，不让它被裁掉 */
function clampInto(el){
  const s=num(el.style.getPropertyValue("--s"),1);
  const b=box();
  const hx=Math.min(50, el.offsetWidth *s/2/b.w*100);
  const hy=Math.min(50, el.offsetHeight*s/2/b.h*100);
  el.style.left=Math.max(hx,Math.min(100-hx, num(el.style.left, 50)))+"%";
  el.style.top =Math.max(hy,Math.min(100-hy, num(el.style.top , 50)))+"%";
}

/* ============================================================
   ④ 控制点：移动 / 缩放 / 旋转 / 图层
   ============================================================ */
function select(el){
  pieces.forEach(p=>p.classList.remove("sel"));
  sel=el; if(el) el.classList.add("sel");
}
function sOf(el){ return num(el.style.getPropertyValue("--s"), 1); }
function rOf(el){ return num(el.style.getPropertyValue("--r"), 0); }   /* 0deg 是合法角度 */
function dist(e,cx,cy){ return Math.hypot(e.clientX-cx,e.clientY-cy); }
function ang(e,cx,cy){ return Math.atan2(e.clientY-cy,e.clientX-cx)*180/Math.PI; }

let mode=null;

cv.addEventListener("pointerdown",e=>{
  if(carry){ e.preventDefault(); putDown(e.clientX,e.clientY); return; }   // 跟手模式下点画布落下
  const p=e.target.closest(".pc");
  if(!p){ select(null); return; }
  select(p);
  const bar=e.target.closest(".pbar");
  if(bar){
    const a=e.target.closest("button")?.dataset.a;
    if(a==="top"){ p.dataset.z=++zTop; p.style.zIndex=p.dataset.z; }
    if(a==="bottom"){
      const min=pieces.length?Math.min(...pieces.map(q=>+q.dataset.z)):0;
      p.dataset.z=min-1; p.style.zIndex=p.dataset.z;
    }
    if(a==="del"){
      p.remove(); pieces=pieces.filter(q=>q!==p); select(null); refresh();
      if(!pieces.length) $("ph").style.display="";
    }
    return;
  }
  const b=box();
  const cx=b.l+b.w*num(p.style.left,50)/100;
  const cy=b.t+b.h*num(p.style.top,50)/100;
  if(e.target.classList.contains("h-scale"))      mode={t:"scale",el:p,d0:dist(e,cx,cy),s0:sOf(p),cx,cy};
  else if(e.target.classList.contains("h-rot"))   mode={t:"rotate",el:p,a0:ang(e,cx,cy),r0:rOf(p),cx,cy};
  else mode={t:"move",el:p,b,           // b 存下来给 pointermove 用（拖动期间画布不动）
             dx:e.clientX-cx,           // 抓点相对牌心的偏移（视口坐标）
             dy:e.clientY-cy};
  try{ p.setPointerCapture(e.pointerId); }catch(_){}
});

addEventListener("pointermove",e=>{
  if(!mode) return;
  const p=mode.el;
  if(mode.t==="move"){
    /* ⚠ 两次坐标换算，缺一不可：
       ① 减 b.l / b.t —— dx 是在「视口坐标」下算的（e.clientX - 牌心），
          而 left% 要的是「画布内坐标」。少了这一减，X 会整体偏掉 b.l
          （画布在中间栏时 b.l≈440 / 画布宽 516，牌一拖就贴右边缘）。
       ② 夹取用 b.w / b.h（内容盒），和 clampInto 保持同一套坐标 ——
          之前这里用含边框的 r.width，和 clampInto 的 clientWidth 差 4px。
       b 在 pointerdown 时存进 mode，拖动期间画布不动，不必每帧重算。 */
    const b=mode.b;
    const nx=Math.max(0,Math.min(b.w, e.clientX-mode.dx-b.l))/b.w*100;
    const ny=Math.max(0,Math.min(b.h, e.clientY-mode.dy-b.t))/b.h*100;
    p.style.left=nx+"%";
    p.style.top =ny+"%";
    clampInto(p);
  }else if(mode.t==="scale"){
    const k=dist(e,mode.cx,mode.cy)/Math.max(mode.d0,1);
    p.style.setProperty("--s",Math.max(.25,Math.min(4,mode.s0*k)));
    clampInto(p);
  }else{
    let a=mode.r0+(ang(e,mode.cx,mode.cy)-mode.a0);
    if(e.shiftKey) a=Math.round(a/15)*15;
    p.style.setProperty("--r",a+"deg");
  }
});
addEventListener("pointerup",()=>{ mode=null; });

/* ============================================================
   制作单 / 交题
   ============================================================ */
function refresh(){
  $("used").textContent=pieces.length;
  const ok=pieces.length>0 && $("ans").value.trim().length>0;
  $("fileBtn").disabled=!ok;
  $("fileHint").textContent = !pieces.length ? "先拖几个 emoji，再填答案"
                            : (!$("ans").value.trim() ? "还差一个答案" : "可以封存了");
}
$("ans").addEventListener("input",refresh);

$("resetBtn").addEventListener("click",()=>{
  if(pieces.length && !confirm("清空画布？已拖上去的 emoji 都会拿掉。")) return;
  pieces.forEach(p=>p.remove()); pieces=[]; select(null);
  $("used").textContent=pieces.length;
  /* 素材库无限取用，没有「已用」状态要清 */
  $("ph").style.display=""; $("hintTxt").textContent="按住 emoji 拖到画布";
  cancelCarry(); refresh();
});

$("fileBtn").addEventListener("click",()=>{
  stampSound(1.5);
  const st=$("stateStamp");
  st.className="stamp bar"; st.textContent="已 封 存";
  st.classList.add("stamping");
  $("fileBtn").disabled=true; $("fileHint").textContent="已交到广场";
  const h=document.createElement("span");
  h.className="hole"; h.style.right="10px"; h.style.top="10px";
  cv.appendChild(h); requestAnimationFrame(()=>h.classList.add("punching"));
  setTimeout(()=>{ location.href="plaza.html"; },900);
});

$("sndBtn").addEventListener("click",()=>{
  sndOn=!sndOn;
  $("sndBtn").textContent=sndOn?"🔊":"🔇";
  $("sndBtn").classList.toggle("on",sndOn);
  if(sndOn) stampSound(.7);
});
$("sndBtn").classList.add("on");
refresh();
</script>
<script src="pwa.js"></script>
</body>
</html>
