<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拼图台 · 制作单 — 你拼我猜</title>
<link rel="stylesheet" href="base.css">
<style>
/* ============================================================
   拼图台 · 制作单
   转盘取牌 → 拖到画布 → 控制点调姿 → 封存交题

   四条修正：
   ① 画布是固定比例的「画板」，牌用画布相对单位定尺寸 ——
      构图在任何尺寸下长得一样（此前用绝对 px，缩小视口就撑破画布）
   ② 转盘不转（旋转会让点选变成打移动靶）
   ③ 取牌 = 从转盘拖到画布，落点由玩家决定
   ④ 缩放 / 旋转 / 图层都由控制点决定，不用滑杆
   ============================================================ */

/* 抬头压成一条 56px 横带。
   原来 224px（padding 46 + 两行大标题），占屏幕 25%，而它只装三件信息
   （台名 / 单号 / 一句操作提示）。画布页的抬头不该是一块版位，该是一条状态带。 */
.head{flex:0 0 auto;height:56px;padding:0;background:var(--paper-2);
  border-bottom:2px solid var(--ink);display:flex;align-items:center}
.head .wrap{display:flex;align-items:center;gap:18px;height:100%;flex:1 1 auto;min-width:0}
.head .lbl-lg{white-space:nowrap;flex:0 0 auto}
.head h1{margin:0;font-size:13.5px;font-weight:400;color:var(--ink-2);letter-spacing:.02em;
  border-left:1.5px solid var(--ink-4);padding-left:18px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}

/* 子元素解除 min-width 下限：grid 的 1fr 是 minmax(auto,1fr)，
   那个 auto 等于内容的 min-content，窄屏下列会被顶住不缩。 */
.bench>*{min-width:0}
/* 两列断点从 1120 下调到 1000。
   1120 时 1024 宽的屏落进两列，画布只剩 257px（占视口高 33%）——
   而三列在 1024 下能给 424px。断点必须落在「三列还放得下」的位置。 */
@media(max-width:1000px){.bench{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.bench .order{grid-column:1/-1}}
@media(max-width:820px){.bench{grid-template-columns:minmax(0,1fr)}
  .bench .canvas-box{order:1}.bench .wheel-box{order:2}.bench .order{order:3}}

/* ---------- 转盘（静止）---------- */
.wheel-box{text-align:center}
.wheel{position:relative;width:min(268px,100%);aspect-ratio:1;margin:4px auto 0}
/* ⚠ 73vw 不行：轨道收窄时转盘不会跟着收，实测 200px 轨里 scrollWidth 280（溢出 84px）。
   100% 让转盘跟着轨道的**内容宽**走；牌位半径 --R 由 JS 按实际宽度算（见 syncSpokeRadius），
   所以转盘缩小时整圈等比缩小、不会溢出。 */
.wheel .ring{position:absolute;inset:0;border:1.5px dashed var(--ink-3);border-radius:50%}
.wheel .ring2{position:absolute;inset:16%;border:1px solid rgba(23,23,27,.16);border-radius:50%}

/* 十张号码牌改矩形。base.css 白纸黑字写着「唯一的圆是转盘与印章」，
   而这里的牌就是圆的 —— 设计系统里唯一一条被写下来的禁令，
   被它自己的核心物件违反了。而且 23px 的 emoji 装不进 46px 的圆，
   消防车、灭火器都溢出环外，那个圆读作「盖在 emoji 上的镜片」。 */
/* ⚠ 牌的尺寸不能写死 46px。
   我第一版只让 --R（半径）随宽度缩，牌保持 46px —— 1024 下半径约 61px，
   圆周 383px 而十张牌需要 460px，于是**牌互相叠压、压进中心圆盘**。
   （K3：「这是本轮唯一一处『坏了』而非『空着』的问题。」）
   现在牌尺寸也走令牌 --tile，由 JS 按转盘宽度算，与半径成同一比例。 */
.spoke{position:absolute;top:50%;left:50%;
  /* ⚠ 不能在这里写 --tile:46px —— 自定义属性会继承，而元素自身的声明
     会**遮蔽**祖先传来的值。JS 在 .wheel 上设的 --tile 就传不进来了，
     牌永远是 46px，窄窗照样叠压。用 var() 的 fallback 表达默认值。 */
  width:var(--tile,46px);height:var(--tile,46px);margin:calc(var(--tile,46px) / -2);
  display:grid;place-items:center;font-family:var(--emoji);
  font-size:calc(var(--tile,46px) * .5);line-height:1;
  background:var(--paper-4);border:2px solid var(--ink);border-radius:2px;
  box-shadow:3px 3px 0 rgba(23,23,27,.16);cursor:grab;padding:0;touch-action:none;
  /* 半径由 JS 按转盘实际宽度写进 --R —— 写死 -104px 时，
     轨道一窄就整圈溢出（实测被切 92px，切掉的正是拖牌落手点）。 */
  transform:rotate(var(--a)) translateY(calc(-1 * var(--R,104px))) rotate(calc(-1 * var(--a)));
  transition:box-shadow .14s,opacity .2s}
.spoke:hover{box-shadow:0 0 0 4px rgba(31,78,156,.16),3px 3px 0 rgba(23,23,27,.16)}
.spoke:active{cursor:grabbing}
/* 用掉即打孔 —— 孔留在牌上 */
.spoke .hole{width:11px;height:11px;right:4px;top:4px;opacity:0;transition:opacity .2s}
.spoke.used{opacity:.38;cursor:default}
.spoke.used .hole{opacity:1}
.spoke.used:hover{box-shadow:3px 3px 0 rgba(23,23,27,.16)}

.wheel .hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  /* ⚠ 尺寸不能写死。1024 下转盘只有 172px，而写死的圆盘半径 50.5px
     占了半宽的 59%，牌无论放哪都会压上去（实测 4 张）。
     改用转盘宽度的百分比：满尺寸 268px 时 38% ≈ 102px，与原设计接近。 */
  width:38%;height:38%;border-radius:50%;background:var(--paper-2);border:2px solid var(--ink);
  display:grid;place-items:center;z-index:4;text-align:center;padding:6px}
.wheel .hub::after{content:"";position:absolute;inset:-6%;border:1.5px dotted var(--ink-3);border-radius:50%}
.wheel .hub .n{font-family:var(--mono);font-weight:700;font-size:calc(var(--R,104px) * .22);line-height:1}
.wheel .hub .k{font-family:var(--mono);font-size:calc(var(--R,104px) * .09);letter-spacing:.14em;color:var(--ink-3);margin-top:3px}
.wheel-note{margin-top:12px;display:flex;gap:10px;justify-content:center;align-items:center}

/* ---------- 画板 ---------- */

/* ══ 画布页的工作台骨架 ══
   用户要求：「涉及到画布的页面都尽量让它盛满整个页面，因为画布要放大才好操作」。
   实测瓶颈是**宽度**不是高度：画布 520 宽，而工作台有 584 高 —— 高度还空着 250px。
   所以要收窄两轨、放宽工作台，让画布由高度决定。

   不写 calc(100dvh - Npx) 的魔数：数字一改就悄悄错位，flex 不会。 */
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden}
body>.nav{flex:0 0 auto}
main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
/* ⚠ .wrap 带 margin:0 auto —— 放进 flex 容器后 auto margin 会吸收自由空间、
   使 align-self:stretch 失效，元素退化成 fit-content。
   （当初 .bay 踩的同一个坑：宽度随内容变，画布列连锁塌陷。） */
main>*{width:100%}

.bench{display:grid;flex:1 1 auto;min-height:0;align-items:start;padding-top:20px;
  /* 左轨 296：转盘足迹 254px（半径 104 + 牌 23）+ sheet 内边距。
     压到 200 时实测右侧溢出 92px，被切掉的正是拖牌落手点。 */
  grid-template-columns:minmax(0,296px) minmax(0,1fr) minmax(0,224px);gap:16px;
  max-width:min(1600px,100% - 48px)}   /* 比全站 wrap(1180) 宽 —— 画布页优先给画布 */
.bench>*{min-height:0}
/* 三栏都撑满 → 底边对齐。
   评委原话：「左右两栏面板都在 y≈370 处结束，下面空出约 270px 米色死区，
   而画布却一路延伸到底 —— 三栏底边完全没对齐。」
   撑满之后轨道内容纵向居中分布，空的不再是「下面一截」，而是均匀的内边距。 */
.bench>*{align-self:stretch}
.bench .sheet.wheel-box,.bench .sheet.order{display:flex;flex-direction:column}
.bench .sheet.wheel-box>.sheet-bd{flex:1 1 auto;display:flex;flex-direction:column;
  justify-content:center;min-height:0}
.bench .sheet.order>.sheet-bd{flex:1 1 auto;display:flex;flex-direction:column;
  justify-content:center;min-height:0}
.bench .sheet.wheel-box,.bench .sheet.order{overflow:auto}

/* 画布列**只有画布**。
   「重发这手牌」已移到制作单 —— 它本来就是制作单上的动作。
   此前它挂在画布下方，与画布争同一段高度，被压成 0 高、溢出到画布边框上
   （K3 连续三轮点名的那个「渲染事故」：按钮偏左 82px、骑在下边框上）。
   移进制作单之后：按钮是面板里的普通块，画布列只剩一个元素，尺寸计算不再有歧义。 */
.canvas-box{position:relative;min-height:0;min-width:0;overflow:hidden}
/* 平时半透明、hover 才实心：不抢画布的注意力，但一直在手边。 */
.canvas-reset{position:absolute;right:10px;bottom:10px;z-index:4;opacity:.42;
  transition:opacity .16s}
.canvas-reset:hover,.canvas-reset:focus-visible{opacity:1}
.canvas-fit{height:100%;min-height:0;min-width:0;container-type:size;
  display:grid;place-items:center;overflow:hidden}
/* 画布取盒子里能放下的最大正方形。
   为什么要 cqw/cqh：只给 max-height，浏览器不会拿它反推宽度
   （1440x620 下会得到 544x368 的长方）；只给 height:100%+width:auto，
   盒子偏高时又会被 max-width 截成非正方形。cqw/cqh 是唯一能直接表达「两轴取小」的单位。 */
/* 「重发这手牌」必须相对**画布**居中。
   原来它左对齐在 .canvas-box 里：画布中心 515，按钮中心 458，偏左 57px，
   而且底边距页脚琥珀线只有 4px —— 读起来是渲染事故，不是设计。 */
/* 按钮行在画布**下方**，与画布之间 14px（flex gap），不再压在边框上。 */
/* ⚠ flex:0 0 auto 不能省。默认 flex-shrink:1，而 .canvas-fit 是 flex:1 1 auto，
   两者争夺同一段高度时按钮行被压成 0 高 —— 它的内容于是溢出、
   骑到画布的下边框上（K3 点过三次的那个「渲染事故」）。 */


/* ── 印版标记 ──────────────────────────────────────────────
   角线 = 印刷厂的定位角线；版心框 = 可落区；标尺 = 尺寸参照。
   三者都 pointer-events:none，不参与落牌命中判定。 */
.cmarks{position:absolute;inset:0;pointer-events:none;z-index:1}
.cm{position:absolute;width:15px;height:15px;border:0 solid var(--ink-3);opacity:.5}
.cm.tl{left:7px;top:7px;border-left-width:1.5px;border-top-width:1.5px}
.cm.tr{right:7px;top:7px;border-right-width:1.5px;border-top-width:1.5px}
.cm.bl{left:7px;bottom:7px;border-left-width:1.5px;border-bottom-width:1.5px}
.cm.br{right:7px;bottom:7px;border-right-width:1.5px;border-bottom-width:1.5px}
.cframe{position:absolute;inset:24px 24px 34px;border:1px dashed rgba(23,23,27,.16);
  border-radius:2px}
/* 底边标尺：11 格刻度，格宽 = 版心的 1/10 */
.cruler{position:absolute;left:24px;right:24px;bottom:12px;height:8px;
  border-bottom:1px solid var(--ink-4);opacity:.45;
  background:repeating-linear-gradient(90deg,var(--ink-4) 0 1px,transparent 1px 10%)}
.cruler::after{content:"";position:absolute;right:0;top:0;width:1px;height:8px;background:var(--ink-4)}
/* 占位语改成版心说明，不再是两行漂浮的灰字 */
.canvas .ph b{display:block;font-size:10px;letter-spacing:.42em;color:var(--red-ink);
  margin-bottom:7px;font-weight:400}
.canvas .ph span{font-size:11px;opacity:.8}
.canvas{position:relative;width:min(100cqw,100cqh);height:min(100cqw,100cqh);
  aspect-ratio:1/1;margin:0;   /* 取盒子里能放下的最大正方形 */
  
  overflow:hidden;background:var(--paper-4);border:2px solid var(--ink);border-radius:var(--rad);
  box-shadow:var(--sh-soft);touch-action:none;
  background-image:
    /* 纸纤维噪声 —— 原来只有 body 有，画布是纯色。
       评委：「emoji 放上去就是悬浮的贴图 …… 和 Figma 画布没有任何血缘差别。」
       画布本身先得是纸，贴上去的东西才可能像贴在纸上。 */
    var(--fiber),
    repeating-linear-gradient(0deg,rgba(23,23,27,.055) 0 1px,transparent 1px 33.4%),
    repeating-linear-gradient(90deg,rgba(23,23,27,.055) 0 1px,transparent 1px 33.4%);
  background-size:160px 160px,auto,auto}
.canvas.armed{outline:2px dashed var(--blue);outline-offset:-7px}
.canvas .ph{padding-bottom:44px;   /* 给右下角的「重发」让位 */
  position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  font-family:var(--mono);font-size:12px;color:var(--ink-3);line-height:2;pointer-events:none}

/* 牌：尺寸用画布相对单位（--u = 画布宽度的 1%，由 JS 维护）
   —— 这样构图在任何视口下长得一模一样 */
.pc{position:absolute;font-family:var(--emoji);line-height:1;cursor:grab;user-select:none;
  font-size:calc(var(--u) * 12);
  transform:translate(-50%,-50%) scale(var(--s)) rotate(var(--r));
  filter:drop-shadow(1px 2px 0 rgba(23,23,27,.14));
  padding:.04em;border-radius:.06em;touch-action:none}
.pc.sel{cursor:move}
/* ── emoji 上纸：贴纸化 ─────────────────────────────────
   评委原话：「现在的 emoji 是亮面默认 emoji 怼在哑光纸面上，两种材质打架。
   给所有 emoji 加统一描边/贴纸化处理。这是全站美术执行唯一的系统性裂缝。」
   做法是两层 filter 链：
     前四道 = 四方向白色硬描边（贴纸的白边，用画布纸色而非纯白）
     第五道 = 统一方向的硬投影，与本语言「硬投影无模糊」一致
   链式 filter 的顺序有意义：后一道作用于前一道的结果，
   所以投影投的是「带白边的贴纸」而不是「emoji 本身」。 */
.pc .g{pointer-events:none;
  filter:
    drop-shadow(1.6px 0 0 var(--paper-4))
    drop-shadow(-1.6px 0 0 var(--paper-4))
    drop-shadow(0 1.6px 0 var(--paper-4))
    drop-shadow(0 -1.6px 0 var(--paper-4))
    drop-shadow(3px 4px 0 rgba(23,23,27,.30))}
.pc.stamping{animation:stamp-down .28s cubic-bezier(.3,1.5,.5,1)}
@keyframes stamp-down{
  0%{transform:translate(-50%,-50%) scale(calc(var(--s) * 2)) rotate(var(--r));opacity:.2}
  60%{transform:translate(-50%,-50%) scale(calc(var(--s) * .94)) rotate(var(--r));opacity:1}
  100%{transform:translate(-50%,-50%) scale(var(--s)) rotate(var(--r))}}

/* 选中框与控制点：控制点反向缩放，尺寸恒定 */
.pc.sel::before{content:"";position:absolute;inset:-.2em;border:1.5px dashed var(--blue);
  border-radius:.1em;pointer-events:none}
.pc .h{position:absolute;width:16px;height:16px;background:#fff;border:2px solid var(--blue);
  border-radius:50%;transform:scale(calc(1 / var(--s)));cursor:pointer;display:none;z-index:2}
.pc.sel .h{display:block}
.pc .h-rot{left:50%;top:-30px;margin-left:-8px;cursor:grab}
.pc .h-rot::after{content:"↻";position:absolute;inset:0;display:grid;place-items:center;
  font-size:10px;color:var(--blue)}
.pc .h-scale{right:-9px;bottom:-9px;cursor:nwse-resize;background:var(--blue)}
.pc .h-scale::after{content:"";position:absolute;inset:3px;border-right:1.5px solid #fff;
  border-bottom:1.5px solid #fff}
/* 图层与删除：贴在选中框下方的小工具条 */
.pc .pbar{position:absolute;left:50%;bottom:-46px;transform:translateX(-50%) scale(calc(1 / var(--s)));
  display:none;gap:4px;background:var(--paper-4);border:1.5px solid var(--ink);
  border-radius:3px;padding:3px;box-shadow:2px 2px 0 rgba(23,23,27,.18);z-index:3}
.pc.sel .pbar{display:flex}
.pc .pbar button{width:24px;height:24px;display:grid;place-items:center;cursor:pointer;
  background:var(--paper-2);border:1.5px solid var(--ink-4);border-radius:2px;
  font-family:var(--emoji);font-size:12px;line-height:1;padding:0}
.pc .pbar button:hover{background:var(--paper-3);border-color:var(--ink)}

/* 拖动中的浮牌（跟手） */
.drag-ghost{position:fixed;z-index:999;pointer-events:none;font-family:var(--emoji);line-height:1;
  font-size:40px;filter:drop-shadow(2px 4px 0 rgba(23,23,27,.3));opacity:.92;
  transform:translate(-50%,-50%)}
.drag-ghost.out{opacity:.35}

/* ---------- 制作单 ---------- */
.order .sheet-hd{gap:8px}
.order .sheet-hd .stamp{margin-left:auto;font-size:10px;padding:3px 8px}
.ansrow{display:flex;gap:8px;margin:4px 0 2px}
.ansrow input{flex:1;border:none;border-bottom:2px solid var(--ink);background:transparent;
  font-family:var(--mono);font-size:17px;padding:6px 2px;color:var(--ink);outline:none;
  letter-spacing:.1em;border-radius:0;min-width:0}
.ansrow input:focus{border-bottom-color:var(--blue)}
.ansrow input::placeholder{color:var(--ink-3)}
.od{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px dotted var(--ink-4);
  font-family:var(--mono);font-size:12.5px}
.od:last-of-type{border-bottom:none}
.od .k{color:var(--ink-3);font-size:11px;letter-spacing:.1em;white-space:nowrap}
.od .d{flex:1;border-bottom:1px dotted var(--ink-4);transform:translateY(-4px)}
.od b{color:var(--ink);white-space:nowrap}
.od b.blue{color:var(--blue)}

/* ⚠ 必须排在所有基础规则之后：媒体查询不提升优先级，同权重下靠后的赢。 */

/* 窄窗（901–1200）让两条轨道自己收缩，把宽度让给画布。
   评委原话：「1024 下画布被挤到只剩屏宽约 1/3 的小方块，而左侧转盘反而变大了。
   一个『拖、转、缩放』的游戏，在最窄窗口里工作台比工具盒还小，优先级完全颠倒。」
   转盘的牌位半径 --R 是 JS 按实际宽度算的，所以轨道收窄时转盘会等比缩小、不会溢出。 */
@media(max-width:1200px){
  .bench{grid-template-columns:minmax(0,232px) minmax(0,1fr) minmax(0,196px);gap:14px}
}
@media(max-width:1050px){
  .bench{grid-template-columns:minmax(0,200px) minmax(0,1fr) minmax(0,180px);gap:12px}
  .sheet-bd{padding:10px 12px}
}
@media(max-width:900px){
  html,body{height:auto}
  body{display:block;overflow:auto}
  main{display:block}
  .head{height:auto;padding:12px 0}
  .bench{display:grid;height:auto;min-height:0;flex:none;
    grid-template-columns:minmax(0,1fr);gap:14px;max-width:none}
  .canvas-box{display:block;overflow:visible}
  .canvas-fit{container-type:normal;display:block;overflow:visible}
  .canvas{width:100%;height:auto;max-width:560px;margin:0 auto}
  .bench .canvas-box{order:-1}
}
</style>

<main>

<section class="head">
  <div class="wrap">
    <span class="lbl-lg">拼 图 台 · 制 作 单 NO. 1管5-129</span>
    <h1 class="tk">从转盘上拖一张牌，放到画布上</h1>
  </div>
</section>

<section class="bench wrap">

  <!-- ================= 转盘（静止） ================= -->
  <div class="sheet wheel-box">
    <div class="sheet-hd">
      <span class="tag-no">发 牌 器</span>
      <span class="lbl">转 盘</span>
    </div>
    <div class="sheet-bd">
      <div class="wheel" id="wheel">
        <div class="ring"></div>
        <div class="ring2"></div>
        <div id="spokes"></div>
        <div class="hub">
          <div>
            <div class="n" id="left">10</div>
            <div class="k">还 剩</div>
          </div>
        </div>
      </div>
      <div class="wheel-note">
        <span class="lbl" id="hintTxt">按住牌拖到画布</span>
        <button class="ibtn" id="sndBtn" title="音效开关" aria-label="音效开关">🔊</button>
      </div>
    </div>
  </div>

  <!-- ================= 画板 ================= -->
  <div class="canvas-box">
    <!-- 尺寸容器：把「画布」与「按钮行」分开。
         原来两者是 .canvas-box 的同级子元素，配 place-items:center 会**重叠** ——
         按钮骑在画布下边框上（K3 点过三次）。 -->
    <!-- 重发按钮在**画布右下角**。它是画布上的动作，且是破坏性的 ——
         离「封存交题」远一点不会误点。position:absolute 不占纵向空间，
         不参与 min(100cqw,100cqh) 的尺寸计算。
         试过放进制作单：那一行可用宽 176px，而两个按钮需要 272px，装不下。 -->
    <div class="canvas-fit">
    <div class="canvas" id="canvas">
      <!-- 重发按钮挂在**画布自己的角**上。相对 .canvas-box 定位会因画布居中而溢出
           （实测右缘超出画布 45px）。绝对定位不占纵向空间、不参与尺寸计算。 -->
      <button class="btn sm ghost canvas-reset" id="resetBtn" type="button">重 发 这 手 牌</button>
      <!-- 印版标记：角线（定位）+ 版心虚线（落区）+ 底边标尺（尺寸参照）。
           评委原话：「一块纯白矩形，里面只有两行灰字。没有落区暗示、没有尺寸参照、
           没有任何『这是个工作台』的信号。左侧转盘做得那么用心，正主反而像没设计完。」
           这三样都是印刷厂真有的东西，不是新发明的装饰。 -->
      <div class="cmarks" aria-hidden="true">
        <i class="cm tl"></i><i class="cm tr"></i><i class="cm bl"></i><i class="cm br"></i>
        <div class="cframe"></div>
        <div class="cruler"></div>
      </div>
      <div class="ph" id="ph"><b>版 心</b>把牌拖到这里<br><span>点一下已放好的牌可以调它</span></div>
    </div>
    </div>
  </div>

  <!-- ================= 制作单 ================= -->
  <aside class="sheet order">
    <div class="sheet-hd">
      <span class="lbl">制 作 单</span>
      <span class="stamp bar blue" id="stateStamp">未 封 存</span>
    </div>
    <div class="sheet-bd">
      <div class="ansrow">
        <input type="text" id="ans" placeholder="谜底答案" maxlength="12" autocomplete="off">
      </div>
      <div class="od"><span class="k">分 类</span><span class="d"></span><b>成语</b></div>
      <div class="od"><span class="k">用 牌</span><span class="d"></span><b class="blue" id="used">0 / 10</b></div>
      <div class="od"><span class="k">限 时</span><span class="d"></span><b>60 秒</b></div>
      <div class="od"><span class="k">编 号</span><span class="d"></span><b>1管5-129</b></div>
      <div class="btn-row" style="margin-top:16px">
        <button class="btn" id="fileBtn" disabled>封 存 交 题</button>
      </div>
      <div class="hint" style="margin-top:10px" id="fileHint">先放一张牌，再填答案</div>
    </div>
  </aside>

</section>

<footer class="site">

<script>
const $=id=>document.getElementById(id);

/* ============================================================
   音效：Web Audio 合成「盖章」，不加载任何音频文件
   ============================================================ */
let AC=null, sndOn=true;
function ac(){
  if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended") AC.resume();
  return AC;
}
function stampSound(power){
  if(!sndOn) return;
  let c; try{ c=ac(); }catch(e){ return; }
  const t=c.currentTime, p=Math.max(.35,Math.min(1.6,power||1));
  const o=c.createOscillator(), g=c.createGain();
  o.type="sine";
  o.frequency.setValueAtTime(190*p,t);
  o.frequency.exponentialRampToValueAtTime(46,t+.11);
  g.gain.setValueAtTime(.26*p,t);
  g.gain.exponentialRampToValueAtTime(.0008,t+.17);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+.19);
  const n=Math.floor(c.sampleRate*.045);
  const buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3.2);
  const src=c.createBufferSource(); src.buffer=buf;
  const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=1700; bp.Q.value=.85;
  const ng=c.createGain(); ng.gain.value=.16*p;
  src.connect(bp).connect(ng).connect(c.destination); src.start(t);
}
function pickSound(){
  if(!sndOn) return;
  let c; try{ c=ac(); }catch(e){ return; }
  const t=c.currentTime, o=c.createOscillator(), g=c.createGain();
  o.type="square"; o.frequency.setValueAtTime(880,t);
  o.frequency.exponentialRampToValueAtTime(420,t+.05);
  g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0005,t+.07);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+.08);
}

/* ============================================================
   ① 画板单位：--u = 画布宽度的 1%
   牌的字号 = calc(var(--u) * 12)，于是构图在任何尺寸下一致
   ============================================================ */
const cv=$("canvas");
function setUnit(){ cv.style.setProperty("--u", (cv.clientWidth/100)+"px"); }
new ResizeObserver(setUnit).observe(cv);
setUnit();

/* ============================================================
   ② 转盘静止：十张牌按 36° 均分，不旋转
   ============================================================ */
const POOL=["🔥","⛽","💧","🪵","🌫️","🧯","🕯️","☀️","🥵","🚒"];
const ANGS=Array.from({length:10},(_,i)=>i*36);
/* --R：牌位半径 = 转盘宽度的一半 − 牌自身半径 − 6px 余量。
   转盘足迹 = 2×(R + 牌半径)，写死 104 时轨道窄了就整圈溢出。 */
function syncSpokeRadius(){
  const w=document.querySelector(".wheel"); if(!w) return;
  const half=w.getBoundingClientRect().width/2;
  // 牌尺寸 = 转盘半宽的 34%（满尺寸时 134×.34 ≈ 46，与原设计一致）
  const tile=Math.max(24, Math.round(half*0.34));
  // 半径要同时满足两个约束：
  //   上限 —— 牌完整落在转盘内：half − 半个牌 − 4
  //   下限 —— 牌不压中心圆盘：中心圆盘半径（含 ::after 的 8px 外扩）+ 半个牌 + 3
  // 只写下限时 1024 下会有 4 张牌压进「10 还剩」那个圆盘里。
  const hub=w.querySelector(".hub");
  const hubR=hub ? hub.getBoundingClientRect().width/2 + 8 : 0;
  const hi=Math.round(half - tile/2 - 4);
  const lo=Math.round(hubR + tile/2 + 3);
  const R=Math.max(30, Math.min(hi, Math.max(lo, hi)));
  w.dataset.rLo = lo; w.dataset.rHi = hi;
  w.style.setProperty("--tile", tile+"px");
  w.style.setProperty("--R", R+"px");
  // 十张牌在半径 R 的圆周上需要的弧长是 10×tile；不够就报告出来，别让它悄悄重叠。
  const need=10*tile, have=2*Math.PI*R;
  w.dataset.fit = need<=have ? "ok" : "tight";
}
addEventListener("resize",syncSpokeRadius);
if(window.ResizeObserver) new ResizeObserver(syncSpokeRadius).observe(document.documentElement);

$("spokes").innerHTML=POOL.map((g,k)=>
  `<button class="spoke" style="--a:${ANGS[k]}deg" data-i="${k}" type="button"
     title="拖到画布上"><span>${g}</span><span class="hole"></span></button>`).join("");

let pieces=[], zTop=1, sel=null, usedCount=0, carry=null;
syncSpokeRadius();

/* ============================================================
   ③ 取牌 = 从转盘拖到画布（落点由玩家决定）
   鼠标：按住拖 → 松开落下
   触屏：点一下拿起（跟手）→ 再点画布落下
   ============================================================ */
function pickUp(spoke,glyph,x,y){
  const el=document.createElement("div");
  el.className="drag-ghost"; el.textContent=glyph;
  el.style.left=x+"px"; el.style.top=y+"px";
  document.body.appendChild(el);
  carry={spoke,glyph,ghost:el,startX:x,startY:y,moved:false};
  moveGhost(x,y); pickSound();
}
function moveGhost(x,y){
  if(!carry) return;
  carry.ghost.style.left=x+"px"; carry.ghost.style.top=y+"px";
  const r=cv.getBoundingClientRect();
  const inside = x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;
  carry.ghost.classList.toggle("out",!inside);
}
function cancelCarry(){
  if(!carry) return;
  carry.ghost.remove(); carry=null; cv.classList.remove("armed");
  $("hintTxt").textContent="按住牌拖到画布";
}
function putDown(clientX,clientY){
  if(!carry) return false;
  const b=box();
  const inside = clientX>=b.l&&clientX<=b.l+b.w&&clientY>=b.t&&clientY<=b.t+b.h;
  if(!inside){ cancelCarry(); return false; }
  const x=(clientX-b.l)/b.w*100, y=(clientY-b.t)/b.h*100;
  const sp=carry.spoke, glyph=carry.glyph;
  carry.ghost.remove(); carry=null; cv.classList.remove("armed");
  sp.classList.add("used");
  usedCount++; $("left").textContent=10-usedCount;
  $("hintTxt").textContent = usedCount>=10 ? "牌发完了" : "按住牌拖到画布";
  place(glyph,x,y,true);
  return true;
}

$("spokes").addEventListener("pointerdown",e=>{
  const sp=e.target.closest(".spoke");
  if(!sp||sp.classList.contains("used")) return;
  e.preventDefault();
  cancelCarry();
  pickUp(sp, sp.querySelector("span").textContent, e.clientX, e.clientY);
  try{ sp.setPointerCapture(e.pointerId); }catch(_){}
});
$("spokes").addEventListener("pointermove",e=>{
  if(!carry) return;
  if(Math.hypot(e.clientX-carry.startX,e.clientY-carry.startY)>5) carry.moved=true;
  moveGhost(e.clientX,e.clientY);
});
$("spokes").addEventListener("pointerup",e=>{
  if(!carry) return;
  if(carry.moved){                       // 拖动了 → 松手即落
    putDown(e.clientX,e.clientY);
  }else{                                 // 只是点了一下 → 保持跟手，等玩家点画布
    cv.classList.add("armed");
    $("hintTxt").textContent="已拿起 · 点画布放下";
  }
});
$("spokes").addEventListener("pointercancel",cancelCarry);
addEventListener("keydown",e=>{ if(e.key==="Escape") cancelCarry(); });

/* ============================================================
   放牌
   ============================================================ */
function place(glyph,x,y,isNew){
  const el=document.createElement("div");
  el.className="pc";
  el.style.left=x+"%"; el.style.top=y+"%";
  el.style.setProperty("--s",1);
  el.style.setProperty("--r","0deg");
  el.dataset.z=++zTop; el.style.zIndex=el.dataset.z;
  el.innerHTML=`<span class="g">${glyph}</span>
    <span class="h h-rot" title="拖动旋转（按住 Shift 吸附 15°）"></span>
    <span class="h h-scale" title="拖动缩放"></span>
    <span class="pbar">
      <button type="button" data-a="top" title="置顶">⬆</button>
      <button type="button" data-a="bottom" title="置底">⬇</button>
      <button type="button" data-a="del" title="删掉这张">🗑</button>
    </span>`;
  cv.appendChild(el); pieces.push(el);
  clampInto(el);
  if(isNew){ el.classList.add("stamping"); setTimeout(()=>el.classList.remove("stamping"),300); stampSound(1); }
  $("ph").style.display="none";
  select(el); refresh();
}

/* ⚠ 一个数字工具：parseFloat 失败才回退，不要用 || 兜底。
   `parseFloat(x) || 50` 是错的 —— 位置合法地等于 0 时，0 是假值，
   会被当成"没值"而替换成 50。表现就是牌一拖到左/上边缘就弹回中心。 */
function num(v,dflt){ const n=parseFloat(v); return isNaN(n)?dflt:n; }

/* 画布的内容盒（left:% 的参照系）。
   注意：left:% 相对的是**内边距盒**，而 getBoundingClientRect() 给的是**边框盒**，
   两者差一个 2px 边框。统一用这一个函数取，避免两套坐标系各夹各的。 */
function box(){
  const r=cv.getBoundingClientRect(), cs=getComputedStyle(cv);
  return { l:r.left+parseFloat(cs.borderLeftWidth),
           t:r.top +parseFloat(cs.borderTopWidth),
           w:cv.clientWidth, h:cv.clientHeight };
}

/* 把牌夹在画布里，不让它被裁掉 */
function clampInto(el){
  const s=num(el.style.getPropertyValue("--s"),1);
  const b=box();
  const hx=Math.min(50, el.offsetWidth *s/2/b.w*100);
  const hy=Math.min(50, el.offsetHeight*s/2/b.h*100);
  el.style.left=Math.max(hx,Math.min(100-hx, num(el.style.left, 50)))+"%";
  el.style.top =Math.max(hy,Math.min(100-hy, num(el.style.top , 50)))+"%";
}

/* ============================================================
   ④ 控制点：移动 / 缩放 / 旋转 / 图层
   ============================================================ */
function select(el){
  pieces.forEach(p=>p.classList.remove("sel"));
  sel=el; if(el) el.classList.add("sel");
}
function sOf(el){ return num(el.style.getPropertyValue("--s"), 1); }
function rOf(el){ return num(el.style.getPropertyValue("--r"), 0); }   /* 0deg 是合法角度 */
function dist(e,cx,cy){ return Math.hypot(e.clientX-cx,e.clientY-cy); }
function ang(e,cx,cy){ return Math.atan2(e.clientY-cy,e.clientX-cx)*180/Math.PI; }

let mode=null;

cv.addEventListener("pointerdown",e=>{
  if(carry){ e.preventDefault(); putDown(e.clientX,e.clientY); return; }   // 跟手模式下点画布落下
  const p=e.target.closest(".pc");
  if(!p){ select(null); return; }
  select(p);
  const bar=e.target.closest(".pbar");
  if(bar){
    const a=e.target.closest("button")?.dataset.a;
    if(a==="top"){ p.dataset.z=++zTop; p.style.zIndex=p.dataset.z; }
    if(a==="bottom"){
      const min=pieces.length?Math.min(...pieces.map(q=>+q.dataset.z)):0;
      p.dataset.z=min-1; p.style.zIndex=p.dataset.z;
    }
    if(a==="del"){
      p.remove(); pieces=pieces.filter(q=>q!==p); select(null); refresh();
      if(!pieces.length) $("ph").style.display="";
    }
    return;
  }
  const b=box();
  const cx=b.l+b.w*num(p.style.left,50)/100;
  const cy=b.t+b.h*num(p.style.top,50)/100;
  if(e.target.classList.contains("h-scale"))      mode={t:"scale",el:p,d0:dist(e,cx,cy),s0:sOf(p),cx,cy};
  else if(e.target.classList.contains("h-rot"))   mode={t:"rotate",el:p,a0:ang(e,cx,cy),r0:rOf(p),cx,cy};
  else mode={t:"move",el:p,b,           // b 存下来给 pointermove 用（拖动期间画布不动）
             dx:e.clientX-cx,           // 抓点相对牌心的偏移（视口坐标）
             dy:e.clientY-cy};
  try{ p.setPointerCapture(e.pointerId); }catch(_){}
});

addEventListener("pointermove",e=>{
  if(!mode) return;
  const p=mode.el;
  if(mode.t==="move"){
    /* ⚠ 两次坐标换算，缺一不可：
       ① 减 b.l / b.t —— dx 是在「视口坐标」下算的（e.clientX - 牌心），
          而 left% 要的是「画布内坐标」。少了这一减，X 会整体偏掉 b.l
          （画布在中间栏时 b.l≈440 / 画布宽 516，牌一拖就贴右边缘）。
       ② 夹取用 b.w / b.h（内容盒），和 clampInto 保持同一套坐标 ——
          之前这里用含边框的 r.width，和 clampInto 的 clientWidth 差 4px。
       b 在 pointerdown 时存进 mode，拖动期间画布不动，不必每帧重算。 */
    const b=mode.b;
    const nx=Math.max(0,Math.min(b.w, e.clientX-mode.dx-b.l))/b.w*100;
    const ny=Math.max(0,Math.min(b.h, e.clientY-mode.dy-b.t))/b.h*100;
    p.style.left=nx+"%";
    p.style.top =ny+"%";
    clampInto(p);
  }else if(mode.t==="scale"){
    const k=dist(e,mode.cx,mode.cy)/Math.max(mode.d0,1);
    p.style.setProperty("--s",Math.max(.25,Math.min(4,mode.s0*k)));
    clampInto(p);
  }else{
    let a=mode.r0+(ang(e,mode.cx,mode.cy)-mode.a0);
    if(e.shiftKey) a=Math.round(a/15)*15;
    p.style.setProperty("--r",a+"deg");
  }
});
addEventListener("pointerup",()=>{ mode=null; });

/* ============================================================
   制作单 / 交题
   ============================================================ */
function refresh(){
  $("used").textContent=usedCount+" / 10";
  const ok=pieces.length>0 && $("ans").value.trim().length>0;
  $("fileBtn").disabled=!ok;
  $("fileHint").textContent = !pieces.length ? "先放一张牌，再填答案"
                            : (!$("ans").value.trim() ? "还差一个答案" : "可以封存了");
}
$("ans").addEventListener("input",refresh);

$("resetBtn").addEventListener("click",()=>{
  if(pieces.length && !confirm("重发这手牌？画布会清空，十张牌都会回来。")) return;
  pieces.forEach(p=>p.remove()); pieces=[]; select(null);
  usedCount=0; $("left").textContent=10;
  document.querySelectorAll(".spoke").forEach(s=>s.classList.remove("used"));
  $("ph").style.display=""; $("hintTxt").textContent="按住牌拖到画布";
  cancelCarry(); refresh();
});

$("fileBtn").addEventListener("click",()=>{
  stampSound(1.5);
  const st=$("stateStamp");
  st.className="stamp bar"; st.textContent="已 封 存";
  st.classList.add("stamping");
  $("fileBtn").disabled=true; $("fileHint").textContent="已交到广场";
  const h=document.createElement("span");
  h.className="hole"; h.style.right="10px"; h.style.top="10px";
  cv.appendChild(h); requestAnimationFrame(()=>h.classList.add("punching"));
  setTimeout(()=>{ location.href="plaza.html"; },900);
});

$("sndBtn").addEventListener("click",()=>{
  sndOn=!sndOn;
  $("sndBtn").textContent=sndOn?"🔊":"🔇";
  $("sndBtn").classList.toggle("on",sndOn);
  if(sndOn) stampSound(.7);
});
$("sndBtn").classList.add("on");
refresh();
</script>
<script src="pwa.js"></script>
</body>
