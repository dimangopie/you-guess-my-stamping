<style>
/* ============================================================
   广场 /plaza  —— 公告栏（设计语言 v3 = v1 物料 + 两条扩展轴）
   任务：发现内容。别人拼的题都贴在这儿。
   与「大厅 /lobby」分工：广场是"有什么好玩的"，大厅是"我要玩哪个模式"。

   物理动作：张贴 · 盖章（封存／揭晓）· 打孔归档 · 调阅卷宗 · 撕口
   材质：公告 = 纸；榜单 = 屏；导航／页脚 = 牌
   简化律：印章只留 3 枚（主章／封存／揭晓），
           其余状态一律 .pip；甜区一律 .gauge；说明性小字删净。
   ============================================================ */

/* ---------- 通告条：贴在公告栏最上沿的纸 ---------- */
.bulletin{background:var(--paper-4);border-bottom:2px solid var(--ink)}
.bl-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding-top:9px;padding-bottom:9px;font-size:13px}
.bl-txt{flex:1 1 320px;min-width:0}
.bl-x{background:var(--paper-2);border:1.5px solid var(--ink);border-radius:2px;cursor:pointer;
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;padding:3px 10px;color:var(--ink);
  transition:.15s;white-space:nowrap}
.bl-x:hover{background:var(--ink);color:var(--paper)}

/* ---------- 页头 ---------- */
.head{padding:46px 0 12px}
.head-grid{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:end}
@media(max-width:860px){.head-grid{grid-template-columns:1fr;gap:26px}}
.head h1{margin:14px 0 16px}
.head-stamps{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
/* 页头右侧：三个数字，不加「件」不加形容 */
.head-side{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.head-side .n{color:var(--ink);font-family:var(--mono);font-size:15px;font-weight:700}
.head-side .n.red{color:var(--red-ink)}
@media(max-width:860px){.head-side{text-align:left;align-items:flex-start}}

/* 每日一题：公告本身是纸，只有倒计时那一小块是屏 */
.today{margin-top:30px;background:var(--paper-4);border:2px solid var(--ink);border-radius:var(--rad);
  box-shadow:var(--sh-soft);display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;
  padding:20px 24px 20px 20px;border-left:8px solid var(--red)}
.today h2{font-size:24px;font-weight:900;letter-spacing:.22em;margin-bottom:8px;color:var(--ink)}
.today .kv{font-family:var(--mono);font-size:12px;color:var(--ink-3);letter-spacing:.04em}
.today .right{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.today .cd b{font-variant-numeric:tabular-nums;margin-left:9px}
.today .cd{background:var(--screen);color:#A8B2C6;border-radius:2px;padding:9px 18px;text-align:center;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;white-space:nowrap}
.today .cd b{display:block;font-size:26px;color:var(--amber);letter-spacing:.06em;
  font-variant-numeric:tabular-nums;margin-top:3px}
@media(max-width:700px){.today{grid-template-columns:1fr}.today .cd{text-align:center}}

/* ---------- 主体两栏 ---------- */
.body{display:grid;grid-template-columns:1fr 388px;gap:34px;align-items:start}
@media(max-width:1020px){.body{grid-template-columns:1fr;gap:44px}}

/* 筛选：纸条，选中的压一条印红；甜区不再写数字，交给一条刻度 */
.filter{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.filter button{font-family:var(--mono);font-size:12px;letter-spacing:.1em;padding:7px 15px;
  background:var(--paper-2);color:var(--ink-3);border:1.5px solid var(--ink-4);border-radius:2px;
  cursor:pointer;transition:.15s}
.filter button:hover{border-color:var(--ink);color:var(--ink)}
.filter button[aria-pressed="true"]{background:var(--paper-4);color:var(--ink);border-color:var(--ink);
  box-shadow:inset 0 -3px 0 var(--red)}
.filter .gauge{flex:0 0 132px;margin-left:auto}
@media(max-width:520px){.filter .gauge{margin-left:0;flex:1 1 100%}}

/* ---------- 公告卡 ---------- */
.notices{display:grid;gap:16px}
.notice{position:relative;background:var(--paper-4);border:2px solid var(--ink);border-radius:var(--rad);
  box-shadow:var(--sh-soft);transition:.16s}
.notice:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 rgba(23,23,27,.16)}
.notice.archived .n-hd{padding-right:48px}       /* 给右上角那枚归档孔留位置 */
.notice .hole{right:20px;top:13px}
.n-hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 16px;background:var(--paper-2);border-bottom:2px solid var(--ink)}
.n-hd .n-time{margin-left:auto}                  /* 时间是内容，不归 .lbl 管 */
.n-time{font-family:var(--mono);font-size:11px;color:var(--ink-2);letter-spacing:.06em;white-space:nowrap}
.n-bd{display:grid;grid-template-columns:112px 1fr;gap:18px;padding:16px}
.n-bd .snap{width:112px;height:112px}
.n-bd .snap .pc{font-size:23px}
.n-bd h3{font-size:21px;letter-spacing:.16em;font-weight:900;margin:6px 0 8px}
.n-kv{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);letter-spacing:.03em;line-height:1.95}
.n-kv b{color:var(--ink-2);font-weight:700}
.n-act{margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media(max-width:560px){.n-bd{grid-template-columns:1fr}.n-bd .snap{width:100%;height:auto;aspect-ratio:1}}

/* 最佳歪解条 */
.wrong{margin-top:11px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  background:rgba(211,58,44,.06);border-left:3px solid var(--red);padding:8px 12px;border-radius:2px}
.wrong .q{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--red-ink);letter-spacing:.03em}
.wrong .v{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:auto;white-space:nowrap}

/* 复印件（追加的卷宗）：更淡、纸色降一级 */
.notice.copy2{background:var(--paper-2)}
.notice.copy2 .n-hd{background:var(--paper-3)}
.notice.copy2 .n-bd h3{color:var(--ink-2)}

/* ---------- 榜单大屏（深色 = 屏） ---------- */
.rail{display:grid;gap:20px;position:sticky;top:88px}
@media(max-width:1020px){.rail{position:static}}
.rk-hd{display:flex;align-items:center;gap:10px;padding:11px 16px;
  background:var(--paper-2);border-bottom:2px solid var(--ink)}
.rk-hd .t{font-weight:900;letter-spacing:.14em;font-size:15px}
.rk-hd .s{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.1em;margin-left:auto}
.rk-hd .mk{border:none;background:none;padding:0;cursor:pointer;margin-left:6px;line-height:1;
  display:inline-flex;align-items:center}
.rk-hd .mk:hover .pip{color:var(--ink)}
/* 「新 3」的两态：暖琥珀 = 没看过；去掉 .warm 就是系统默认的灰 = 看过了 */
.rk .row{grid-template-columns:38px 1fr auto}
.rk .c1{text-align:center;padding-left:8px;padding-right:8px}
.rk .c3{text-align:right;white-space:nowrap}
.rk .c3 b{color:var(--amber)}
.rk .sub{font-family:var(--mono);font-size:10.5px;color:#6F6C61;display:block;margin-top:2px}
.rk .row.top1 .c1{color:var(--red-ink)}
.rk .row.top1 .c2{color:#fff}

/* ---------- 调阅更多卷宗 ---------- */
.more-row{margin-top:22px;padding-top:18px;border-top:2px dashed var(--ink-4);
  display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.more-row .hint{margin-left:auto}
.progress{flex:1 1 240px;display:flex;align-items:center;gap:12px;min-width:180px}
.p-no{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--ink-3);white-space:nowrap}
.thinbar{flex:1;height:2px;background:var(--paper-3);min-width:70px}
/* 细实线进度：一格一格跳，不做缓动 */
.thinbar i{display:block;height:2px;width:0;background:var(--ink)}


/* ---------- 热门词库 ---------- */
.bankrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(232px, 100%), 1fr));gap:16px}
.idx .gauge{margin-top:10px}
.idx .gauge .val{font-size:15px}
</style>

  `<span class="pc" style="left:${LAYOUT[k].x}%;top:${LAYOUT[k].y}%;--s:${LAYOUT[k].s};--r:${LAYOUT[k].r}deg">${e}</span>`
).join("")}</div>`;
/* 甜区刻度：一条线 + 40~60% 的带 + 一枚指针。数字说话，不写形容词 */
const gauge=(r,sweet)=>`<span class="gauge"><span class="track">
  <i class="band" style="left:40%;right:40%"></i><i class="pin" style="left:${r}%"></i></span>
  <b class="val"${sweet?" style=\"color:var(--blue)\"":""}>${r}%</b></span>`;

/* ---------- 公告卡：状态靠印章（两枚）＋ 数据靠字，说明一律不留 ----------
   谜底封存 = 蓝椭圆章（档案封着）    已揭晓 = 红条章（注销、可以笑了） */
function noticeHtml(p,appended){
  const open=p.st==="open";
  const cls=["notice"];
  /* 复印件：更淡（.copy2）、右上打孔（.hole）、从卷宗里抽出来（.slot-draw） */
  if(appended) cls.push("copy2","archived","slot-draw");
  return `
  <article class="${cls.join(" ")}" data-st="${p.st}" data-rate="${p.rate===null?"":p.rate}"
           data-new="${p.fresh?"1":"0"}">
    ${appended?`<span class="hole" data-hole></span>`:""}
    <div class="n-hd">
      <span class="tag-no">NO. ${p.no}</span>
      ${open?`<span class="stamp oval blue${p.crooked?" crooked":""}">谜 底 封 存</span>`
            :`<span class="stamp bar${p.crooked?" crooked":""}">已 揭 晓</span>`}
      ${p.old?`<span class="tag-out">复 印 件</span>`:""}
      <span class="n-time">${p.ago}</span>
    </div>
    <div class="n-bd">
      ${snap(p)}
      <div>
        <div class="n-kv">出题 <b>${p.by}</b> · ${p.bid}</div>
        ${open?"":`<h3>${p.a}</h3>`}
        <div class="n-kv">用了 <b>${p.u}</b> 张 · 被猜 <b>${p.hits}</b> 次${p.rate!==null?` · 猜中 <b>${p.rate}%</b>`:""}</div>
        ${p.wrong?`<div class="wrong"><span class="tag-no red">最佳歪解</span>
          <span class="q">「${p.wrong}」</span><span class="v">${p.votes} 票</span></div>`:""}
        <div class="n-act">
          ${open?`<a class="btn sm" href="guess.html">去猜</a>`
                 :`<a class="btn sm ghost" href="works.html">时间线</a>
                   <a class="ibtn" href="compose.html" title="试着重拼" aria-label="试着重拼">🔁</a>`}
        </div>
      </div>
    </div>
  </article>`;
}
const listEl=$("notices");
listEl.innerHTML=NOTICES.map(p=>noticeHtml(p,false)).join("");

/* ---------- 公告栏里被塞的那张广告纸（能撕，是出口） ---------- */
/* 夹页广告已整段删除（K3 连续两轮列为 P0）。
   这是一个承诺「免费办理」的产品，塞收费转化话术与价目表都是自相矛盾。 */

/* ---------- 筛选（读 dataset，追加的条目也吃得到） ---------- */
let curF="all";
function applyFilter(f){
  curF=f;
  listEl.querySelectorAll(".notice").forEach(el=>{
    const st=el.dataset.st, rate=el.dataset.rate;
    let show=true;
    if(f==="open") show=st==="open";
    else if(f==="done") show=st==="done";
    else if(f==="sweet") show=rate!==""&&+rate>=40&&+rate<=60;
    else if(f==="new") show=el.dataset.new==="1";
    el.style.display=show?"":"none";
  });
}
$("filter").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  document.querySelectorAll("#filter button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  applyFilter(b.dataset.f);
});

/* ---------- 调阅更多卷宗：走一趟档案室，复印件更淡、右上打孔 ---------- */
let moreI=0, liveN=2043;
const moreBtn=$("moreBtn"), morePrint=$("morePrint"), moreHint=$("moreHint"),
      liveCount=$("liveCount"), printFill=$("printFill"), printNo=$("printNo");
moreBtn.addEventListener("click",()=>{
  if(moreI>=MORE.length) return;
  moreBtn.disabled=true;
  const batch=MORE.slice(moreI,moreI+3);
  printNo.textContent=batch[0].no;
  morePrint.hidden=false;
  moreBtn.textContent="调 阅 中 …";
  /* 细实线进度：七格推完，卷宗出库 */
  const STEPS=7;
  let s=0;
  printFill.style.width="0";
  const step=setInterval(()=>{
    s++;
    printFill.style.width=Math.round(s/STEPS*100)+"%";
    if(s<STEPS) return;
    clearInterval(step);
    batch.forEach(p=>listEl.insertAdjacentHTML("beforeend",noticeHtml(p,true)));
    /* 归档：每张复印件右上角打一个孔 */
    listEl.querySelectorAll(".notice [data-hole]").forEach(h=>{
      requestAnimationFrame(()=>h.classList.add("punching"));
    });
    moreI+=batch.length;
    liveN+=batch.length;
    liveCount.textContent=liveN.toLocaleString("en-US");
    morePrint.hidden=true;
    printFill.style.width="0";
    if(moreI>=MORE.length){
      moreBtn.textContent="没 有 更 多 了";
      moreHint.textContent="12 / 12 · 更早的已归档";
    }else{
      moreBtn.disabled=false;
      moreBtn.textContent="再 调 阅 3 卷";
      moreHint.textContent=(6+moreI)+" / 12";
    }
    applyFilter(curF);
  },120);
});

/* ---------- 榜单 ---------- */
const board=(rows)=>rows.map((r,i)=>`
  <div class="row ${i===0?"top1":""}">
    <div class="c1">${String(i+1).padStart(2,"0")}</div>
    <div class="c2" style="font-size:13.5px">${r.a||r.who||r.q}${r.sub?`<span class="sub">${r.sub}</span>`:""}</div>
    <div class="c3"><b>${r.v}</b></div>
  </div>`).join("");

$("rk-wrong").innerHTML=board(RANK_WRONG.map(r=>({a:`「${r.q}」`,sub:r.from,v:r.v+" 票"})));
$("rk-fast").innerHTML=board(RANK_FAST);
$("rk-maker").innerHTML=board(RANK_MAKER);

/* 这枚小方印就是以前的红点：点一下 = 看过了，方块从琥珀退回灰 */
$("wrongMark").addEventListener("click",function(){
  const s=$("wrongStamp");
  if(!s||s.classList.contains("ink")) return;
  s.classList.remove("warm");s.classList.add("ink");
  s.textContent="已 看";
  this.title="3 条新歪解 · 已看过";
  const tip=document.createElement("div");
  tip.className="hint";
  tip.style.padding="8px 16px";
  tip.textContent="3 条新歪解已看过";
  this.closest(".rk-hd").insertAdjacentElement("afterend",tip);
  setTimeout(()=>tip.remove(),2600);
});

/* ---------- 热门词库 ---------- */
$("bankrow").innerHTML=HOT_BANKS.map(b=>`
  <a class="idx" href="banks.html">
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:10px">
      <span class="tag-no blue">${b.bid}</span>
      <span class="n-time" style="margin-left:auto">${b.by}</span>
    </div>
    <h3 style="font-size:17px;letter-spacing:.1em;margin-bottom:8px">${b.n}</h3>
    <div class="n-time">${b.c} 条 · 被玩 ${b.p} 次</div>
    ${gauge(b.r,b.r>=40&&b.r<=60)}
  </a>`).join("");

/* ---------- 今日倒计时 ---------- */
const cdEl=$("cd");
function tick(){
  const now=new Date(), end=new Date(now); end.setHours(24,0,0,0);
  let s=Math.floor((end-now)/1000);
  const h=String(Math.floor(s/3600)).padStart(2,"0");
  const m=String(Math.floor(s%3600/60)).padStart(2,"0");
  const ss=String(s%60).padStart(2,"0");
  cdEl.textContent=`${h}:${m}:${ss}`;
}
tick();setInterval(tick,1000);

   通告
   （「来访登记」计数器已按简化律整条删除，页脚不再重复导航；
     《张贴须知》与底部回执条已整块删除，不留引用）
   ============================================================ */

/* ---------- 平台通告：撕得下来 ---------- */
$("platX").addEventListener("click",()=>{
  $("platBar").remove();
  console.log("通告撕下来了。它本来还会再贴一次的，老板说算了。");
});

/* ---------- 线路中断通告 ---------- */
const offlineBar=$("offlineBar");
function syncOnline(){
  const off=!navigator.onLine||location.hash==="#offline";
  offlineBar.hidden=!off;
}
addEventListener("online",syncOnline);
addEventListener("offline",syncOnline);
$("offlineX").addEventListener("click",()=>offlineBar.hidden=true);
syncOnline();

/* ---------- 进场 ---------- */
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.1});
document.querySelectorAll(".reveal").forEach(el=>io.observe(el));

</script>
